ObjectType.resourceRef.help=Referência ao recurso ao qual pertence uma sombra de objeto de recurso.
ObjectType.pendingOperation.help=Descreve operações pendentes, por exemplo, operações assíncronas em andamento ou operações que precisam ser revisadas ou corrigidas.
ObjectType.name.help=Nome ou ID do objeto legível por pessoas e editável. Geralmente é exclusivo e obrigatório.
AssignmentType.name.help=Nome ou ID do objeto legível por pessoas e editável. Geralmente é exclusivo e obrigatório.
ObjectType.description.help=Descrição textual livre do objeto
ObjectType.documentation.help=Documentação técnica do objeto no formato AsciiDoc.
ObjectType.lifecycleState.help=Estado do ciclo de vida do objeto, por exemplo, Rascunho, Proposto, Ativo, Obsoleto, Arquivado etc.
FocusType.givenName.help=Nome próprio do usuário, geralmente o primeiro nome (por exemplo, George).
FocusType.familyName.help=Sobrenome do usuário, geralmente o último nome (por exemplo, Washington).
FocusType.additionalName.help=Nome do meio (geralmente), patronímico, matronímico ou outro nome do usuário (por exemplo, Anne ou Ivanovna).
FocusType.nickName.help=Nome familiar ou informal do usuário (por exemplo, Chris).
FocusType.honorificPrefix.help=Títulos honoríficos que antecedem o nome do usuário (por exemplo, Sir ou cpt).
UserType.honorificSuffix.help=Títulos honoríficos que vêm após o nome do usuário (por exemplo, PhD).
FocusType.title.help=Título que define o cargo ou a função principal do usuário na organização (por exemplo, CEO, responsável pela segurança ou assistente).
FocusType.preferredLanguage.help=Idioma preferido do usuário no formato IETF, geralmente utilizado para localizar interfaces de usuário (por exemplo, en_US, cs ou pt_BR).
FocusType.locale.help=Preferência do usuário para a exibição de moedas, datas e outros itens relacionados à localização e à cultura, no formato IETF (por exemplo, en_US, cs ou pt_BR).
FocusType.timezone.help=Fuso horário preferido do usuário, especificado no banco de dados de fusos horários usando o formato Olson (por exemplo, Europe/Bratislava). Se não for especificado, será considerado o fuso horário padrão do sistema.
FocusType.emailAddress.help=Endereço de e-mail utilizado para comunicação (por exemplo, para receber notificações do sistema).
FocusType.telephoneNumber.help=Número de telefone principal do usuário, da unidade organizacional etc.
FocusType.personalNumber.help=Identificador exclusivo e imutável do usuário, com finalidade empresarial. Geralmente utilizado como identificador de correlação.
FocusType.employeeNumber.help=Identificador exclusivo e imutável do funcionário, com finalidade empresarial. Geralmente utilizado como identificador de correlação.
FocusType.costCenter.help=O nome, identificador ou código do centro de custo ao qual o usuário pertence. Como geralmente é utilizado o centro de custo da organização, este campo é considerado apenas para usuários que possuem um centro de custo diferente do de sua organização ou que não pertencem a nenhuma organização.
FocusType.organization.help=Identificador ou nome imutável da organização à qual o usuário pertence. São permitidos vários valores.
FocusType.organizationalUnit.help=Identificador ou nome imutável da unidade organizacional à qual o usuário pertence. São permitidos vários valores.
FocusType.locality.help=Localidade principal do usuário, ou seja, o local onde geralmente trabalha (país, cidade ou prédio). Específico da implantação.
ObjectType.indestructible.help=Proteção contra exclusão acidental. Se definido como 'True', este objeto não poderá ser excluído. Para excluir o objeto, é necessário modificá-lo primeiro para redefinir esta flag.
ObjectType.effectiveMarkRef.help=As marcas efetivas do objeto resultam da aplicação de políticas e regras automáticas de marcação. Essas marcas são calculadas, não definidas diretamente.
AssignmentHolderType.jpegPhoto.help=Foto correspondente ao usuário, à organização ou ao papel.
ObjectType.dead.help=Selecione 'Verdadeiro' para exibir projeções inativas ou 'Falso' para exibir projeções ativas.
ObjectType.objectClass.help=Referência a uma definição de tipo no esquema do recurso (classe de objeto específica).
StorageMetadataType.createTimestamp.help=Data e hora da criação dos dados. É definida uma única vez e nunca deve ser alterada. Se um objeto foi criado por um processo em segundo plano (por exemplo, uma aprovação), indica quando o processo foi concluído.
ObjectType.exists.help=Defina como 'True' para pesquisar objetos que você sabe que existem no recurso. Pode haver sombras de objetos que ainda não existem (por exemplo, operações de criação em andamento) ou sombras de objetos sobre os quais você ainda não tem conhecimento.
ShadowType.intent.help=Tipo de uso ou finalidade pretendida dos objetos. Por exemplo, para contas, pode ser "usuário", "administrador" ou "teste".
ObjectType.kind.help=Tipo de uso da sombra, por exemplo, conta, direito de acesso etc.
StorageMetadataType.modifyTimestamp.help=Data e hora da última modificação dos dados. Deve ser atualizada quando os objetos forem modificados. As modificações que alteram apenas atributos operacionais podem não atualizar esta data e hora.
ObjectType.synchronizationSituation.help=A situação de sincronização mais recente, independentemente do canal.
ObjectType.subtype.help=Subtipo do objeto utilizado para distinguir o que um objeto específico representa, ou seja, se é um tipo diferente de unidade organizacional, projeto, equipe ou usuário, entre outros.
ActivationType.administrativeStatus.help=Filtrar por status administrativo. Isso não define o estado real do objeto, pois um administrador pode, por exemplo, definir um objeto como "habilitado", mesmo que o atributo "validFrom" ainda seja inválido.
MappingsType.administrativeStatus.help=Status definido pelo administrador. Isso não define o estado real do objeto, pois um administrador pode, por exemplo, definir um objeto como "habilitado", mesmo que o atributo "validFrom" ainda seja inválido.
MappingsType.effectiveStatus.help=Status calculado com base em configurações como status administrativo, datas de validade e outras propriedades de ativação. Não é definido diretamente nos objetos.
ConstructionType.resourceRef.help=Referência a um recurso que é o destino da referência. Em alguns casos, pode ser implícita.
AssignmentType.targetRef.help=Destino da atribuição ou indução. É o usuário, papel, organização ou serviço que está sendo atribuído.
ActivationType.help=Define as propriedades de ativação. Determina se um item está ativo e em funcionamento ou inativo (por exemplo, desativado). Por exemplo, um usuário inativo não deve conseguir fazer login ou executar tarefas, e um papel inativo não deve ser atribuído (se atribuído, não deve ser considerado no cálculo das contas).
ActivationType.lockoutStatus.help=Status da conta temporariamente desativada devido a falhas de login ou tentativas semelhantes de uso indevido. Geralmente, é definido pelo recurso ou pela autenticação do midPoint. O valor "Normal" desbloqueia as contas.
ActivationType.validFrom.help=Data a partir da qual um objeto é considerado ativo. Isso não se aplica se a flag "enabled" estiver explicitamente definida.
ActivationType.validTo.help=Data até a qual um objeto é considerado ativo. Isso não se aplica se a flag "enabled" estiver explicitamente definida.
ActivationType.lockoutExpirationTimestamp.help=Data e hora em que o bloqueio da conta expira e ela volta a ficar disponível para uso. Aplica-se apenas se o status de bloqueio não for "Normal".
ObjectType.archetypeRef.help=Referências aos arquétipos ativos aplicáveis, incluindo arquétipos indiretos, como supertipos de arquétipos. Os valores das referências são recalculados somente quando os objetos são recalculados.
ObjectType.parentOrgRef.help=Conjunto de organizações (unidades organizacionais, projetos, equipes) às quais o objeto está relacionado. Geralmente, isso significa que o objeto pertence a elas, mas também pode ter outros significados (por exemplo, o usuário gerencia uma unidade organizacional).
CaseType.parentRef.help=Caso pai (se houver)
AssignmentHolderType.objectRef.help=Objeto ao qual o caso está associado. Em casos de aprovação, geralmente é o objeto cuja modificação, inclusão ou exclusão está sendo aprovada. Em casos de provisionamento manual, pode ser o recurso no qual uma conta será criada. Em casos de correlação, é a sombra (shadow) completa que está sendo correlacionada.
CaseType.requestorRef.help=Usuário que solicitou a respectiva operação
CaseType.state.help=Estado do caso. Os estados predefinidos são: Criado (criado, mas ainda não aberto), Aberto (itens de trabalho criados, trabalho em andamento), Em encerramento (a interação humana foi concluída, mas algumas ações podem estar pendentes, como aguardar o encerramento de uma subtarefa), Em execução (execução automatizada ou aguardando o início da execução), Fechado.
CaseType.targetRef.help=Caso ao qual está associado
ActivationType.effectiveStatus.help=Status calculado com base em configurações como status administrativo, datas de validade e outras propriedades de ativação. Não é definido diretamente nos objetos.
CredentialsType.otps=OTPs
EvenMoreAbstractMappingType.authoritative.help=Controla se o mapeamento remove valores.\n\'True' adiciona e remove valores — use quando houver uma única fonte de verdade.\n\'False' apenas adiciona valores, nunca os remove — use quando houver várias fontes.
EvenMoreAbstractMappingType.exclusive.help=Defina como 'False' (padrão) se a propriedade de destino selecionada puder ser utilizada em outros mapeamentos.\n\Defina como 'True' se este mapeamento for exclusivo da propriedade de destino.
