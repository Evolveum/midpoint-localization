PageTask.wizard.step.execution.subText=Veuillez spécifier les options d'exécution de tâche. Déterminez si la tâche doit exécuter les changements ("Complet") ou seulement simuler les opérations pour analyse ultérieure. Pour une simulation, utilisez "Prévisualiser" ou "Prévisualiser la gestion des reflets - limiter la simulation aux reflets (p.e. les règles de corrélation...)". Veuillez spécifier aussi la configuration à utiliser: "Production" pour utiliser uniquement la configuration active de la ressource, ou "Développement" pour utiliser les configurations active et proposée de la ressource pendant les simulations.
PageTask.wizard.step.execution.subText.shadow=Veuillez spécifier les options d'exécution de tâche. Déterminez si la tâche doit exécuter les changements ("Complet") ou seulement simuler les opérations pour analyse ultérieure. Pour une simulation, utilisez "Prévisualiser la gestion des reflets - limiter la simulation aux reflets (p.e. les règles de corrélation...)". Veuillez spécifier aussi la configuration à utiliser: "Production" pour utiliser uniquement la configuration active de la ressource, ou "Développement" pour utiliser les configurations active et proposée de la ressource pendant les simulations.
