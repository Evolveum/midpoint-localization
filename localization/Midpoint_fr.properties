CreateResourceChoiceTemplatePanel.text=Créer une nouvelle ressource
CreateResourceChoiceTemplatePanel.subText=Une ressource représente un système externe (source ou cible) que midPoint, par exemple un annuaire LDAP, une base de données ou une application. Par le biais de ressources, midPoint peut lire, créer, modifier et désactiver des comptes et autres objets.
CreateResourceChoiceTemplatePanel.subText.moreContent=Pour accélérer la configuration et garantir la consistence, vous pouvez baser votre ressource sur un modèle de ressource existant.\n\nChoisissez « Hériter d'un modèle » pour que la ressource reste liée au modèle. De futures modifications au modèle s'appliqueront aussi à cette ressource.\n\nChoisissez « Copier un modèle » pour n'utiliser le modèle que comme point de départ. Après la création de la ressource, celle-ci est indépendante.\n\nPour plus d'information, référez-vous à la <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/">documentation de midPoint</a>.
