SynchronizationReactionTableWizardPanel.text=Synchronisation
SynchronizationReactionTableWizardPanel.subText=Définir les réactions de synchronisation. Cette configuration spécifie les actions que midPoint effectuera pour les objets de la ressource dans des situations spécifiques, par exemple lorsque des objets de la ressource sont créés ou supprimés en dehors de midPoint.
SynchronizationReactionTableWizardPanel.subText.moreContent=La synchronisation permet à midPoint de détecter et réagir aux changements qui surviennent directement dans la ressource. Lorsque des objets sont découverts ou modifiés pendant la synchronisation, midPoint évalue leur situation et applique les réactions configurées.\n\nPar exemple, si un nouveau compte est découvert dans la ressource, midPoint peut le lier à une identité existante, créer une nouvelle identité, ou signaler le cas pour vérification manuelle. Ceci aide à maintenir la cohérence entre les identités dans midPoint et l'état réel des systèmes connectés.\n\nPour plus d'information, consultez la <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/synchronization/">documentation de midPoint</a>.
SynchronizationReactionTableWizardPanel.saveButton=Enregistrer les paramètres de synchronisation
SynchronizationReactionTableWizardPanel.headerLabel=List of reactions
SynchronizationStep.action.tooltip.handlerUri=L'action explicite à exécuter. Veuillez noter que la plupart des actions sont conçues pour fonctionner avec l'algorithme de synchronisation par défaut de {0} et que cet algorithme sera exécuté à moins qu'il ne soit explicitement désactivé (le résultat peut alors être une erreur). Notez également que même si aucune action explicite n'est sélectionnée, le système continuera à utiliser l'algorithme de synchronisation par défaut si l'option "Synchroniser" a été sélectionnée.
SynchronizationStep.action.tooltip.order=Indique si l'action explicite est exécutée avant les algorithmes de synchronisation par défaut de {0} ou après ceux-ci. La plupart des actions intégrées sont conçues pour être exécutées avant la synchronisation système dans la mesure où elles n'établissent que le contexte du modèle et laissent ensuite le système effectuer le vrai travail. Cependant, on peut devoir exécuter certaines actions personnalisées après la synchronisation, par exemple pour envoyer des notifications, nettoyer, etc.
