ExecuteChangeOptionsPanel.label.executeAfterAllApprovals.help=Si coché, l'exécution des changements est reportée jusqu'après collecte de toutes les validations requises.\nSi non coché, des changements partiels sont exécutés dès après leur approbation, ou immédiatement lorsqu'aucune validation n'est requise.
ExecuteChangeOptionsPanel.label.force=Forcer
ExecuteChangeOptionsPanel.label.force.help=Forcer l'opération dans le cas où elle devrait normalement rater en raison d'un échec externe. Par exemple, la tentative de suppression d'un compte n'existant plus sur une ressource peut rater si l'option Forcer n'est pas cochée. En cochant cette option, l'opération se termine avec succès même lorsque le compte à supprimer n'existe pas (ce qui signifie qu'au moins le reflet du compte est retiré du dépôt de {0}).
