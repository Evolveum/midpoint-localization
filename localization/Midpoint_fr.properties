InternalsMemoryPanel.text.explanation=Pour obtenir de l'information concernant la mémoire en tas de Java, les outils <b>jmap</b> et/ou <b>jhsdb</b> du JDK sont nécessaires. Ils se trouvent soit dans un chemin d'accès par défaut du système d'exploitation, soit dans le répertoire "$JAVA_HOME/bin", soit configurés explicitement dans le fichier "config.xml" (sous les clés "midpoint.system.jmap" / "midpoint.system.jhsdb") ou définis en tant que propriétés système "midpoint.system.jmap" / "midpoint.system.jhsdb". Alternativement, vous pouvez définir les commandes appropriées via les propriétés <b>heapInfoCommand</b> et <b>heapObjectsHistogramCommand</b> dans le conteneur de configuration système <b>internals/memoryDiagnostics</b>.
