roleMiningExportPanel.export.label.help=Types d'objets qui seront traités et exportés. Veuillez noter que les « rôles » et « utilisateurs » doivent être inclus dans l'export pour qu'il soit utile. L'inclusion d'une structure organisationnelle peut grandement aider au futur développement de la découverte de rôles. \nLes ensembles d'objets exportés peuvent être réduits en utilisant des filtres optionnels.
