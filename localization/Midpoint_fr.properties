PageResource.wizard.step.basicInformation=Informations de base
PageResource.wizard.step.basicInformation.text=Informations de base concernant la ressource
PageResource.wizard.step.basicInformation.subText=Nommez votre ressource et choisissez l'état initial de son cycle de vie
BasicInformationResourceStepPanel.subText.moreContent=Le nom inclut la ressource au sein de midPoint, de sorte qu'il doit y être unique et indiquer clairement le système que cette ressource représente.\n\nL'état de cycle de vie détermine si la ressource est prête à être utilisée. Par exemple, vous pouvez maintenir une ressource en état Proposé pendant que vous finalisez la configuration des paramètres de connexion, de la manutention du schéma, des correspondances et d'autres détails d'intégration. Une fois que la configuration est complète et vérifiée au moyen de simulations, vous pouvez modifier la ressource en état Actif afin qu'elle puisse être utilisée pour l'approvisionnement et la synchronisation\n\nPour plus d'information, référez-vous à la <a href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/#basic-information" target="_blank">la documentation de midPoint</a>.
PageResource.wizard.step.configuration=Configuration
PageResource.wizard.step.configuration.text=Establish a connection
PageResource.wizard.step.configuration.subText=Configurez la connexion de midPoint au système distant.
PageResource.wizard.step.partialConfiguration.subText=Configurez la connexion de midPoint au système distant.
PartialConfigurationStepPanel.subText.moreContent=Ces paramètres définissent comment midPoint communique avec les systèmes représentés par cette ressource. Ils incluent typiquement la localisation du système (un hôte, une URL...) et des informations d'identification utilisées pour l'authentification.\n\nLa configuration dépend du connecteur sélectionné et des capacités du système cible. Assurez-vous que le compte fourni dispose de privilèges suffisants pour les opérations que midPoint doit pouvoir effectuer, telles que lire les objets, créer des comptes ou modifier des attributs.\n\nPour plus d'information, consultez la <a href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/#establish-a-connection" target="_blank">documentation midPoint</a>.
PageResource.wizard.step.discovery=Découverte
PageResource.wizard.step.discovery.title=Options de découverte
PageResource.wizard.step.discovery.text=Découverte par midPoint
PageResource.wizard.step.discovery.subText=Votre ressource a suivi le processus de découverte et midPoint a trouvé les paramètres de configuration suivants.
DiscoveryStepPanel.subText.moreContent=La fonction de découverte facilite la configuration de la ressource en analysant le système distant et en suggérant la configuration de sa connexion ainsi que ses capacités. Vérifiez les paramètres détectés pour vous assurer qu'ils correspondent bien à votre système.\n\nPour plus d'informations, consultez <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/#midpoint-discovery">la documentation de midPoint</a>.
PageResource.wizard.step.selectObjectClasses=Schéma de ressource
PageResource.wizard.step.selectObjectClasses.text=Schéma de ressource
PageResource.wizard.step.selectObjectClasses.subText=Select object classes that midPoint should be restricted to, otherwise all object classes will be available. Keep default if unsure.
SelectObjectClassesStepPanel.subText.moreContent=Object class selection allows you to limit the scope of resource integration. By selecting specific classes, you define which objects are relevant for synchronization, etc. \n\nIf you are unsure which classes to select, keeping the default selection is usually sufficient for most setups and allows the resource to operate with standard behavior in midPoint. \n\nFor more information, see <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/#schema-of-object-types">midPoint documentation</a>.
PageResource.wizard.step.objectType.basicSettings=Informations de base
PageResource.wizard.step.objectType.basicSettings.text=Informations de base concernant le type d'objet
PageResource.wizard.step.objectType.basicSettings.subText=Describe the intended purpose of the object type. An object type specifies how a particular kind of resource object (e.g., account or entitlement) is handled by midPoint.
BasicSettingResourceObjectTypeStepPanel.subText.moreContent=An object type represents a logical category of objects on the resource and determines how those objects are treated by midPoint. Use this definition to express the intended role of the object type within your system setup. \n\nThis is a high-level configuration that helps align resource behavior with how the system should manage different kinds of objects. \n\nFor more information, see <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/#basic-attributes">midPoint documentation</a>.
PageResource.wizard.step.objectType.delineation=Données dans la ressource
PageResource.wizard.step.objectType.delineation.text=Spécifiez les données de la ressource
PageResource.wizard.step.objectType.delineation.subText=Define resource objects that belong to (are classified under) the object type. You can specify the resource objects by object class alone or using additional resource object properties.
DelineationResourceObjectTypeStepPanel.subText.moreContent=This step allows you to narrow the scope of objects that will be handled under this object type in midPoint. By default, objects are selected based on the object class. If needed, you can further refine the selection using filters or expressions based on resource object properties to better match your intended configuration. \n\nFor more information, see <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/#specify-the-resource-data">midPoint documentation</a>.
PageResource.wizard.step.objectType.focus=Données dans midPoint
PageResource.wizard.step.objectType.focus.text=Specify the midPoint data
PageResource.wizard.step.objectType.focus.subText=Define the Type (and optionally Archetype) that will represent the resource objects classified under this object type in midPoint.
FocusResourceObjectTypeStepPanel.subText.moreContent=Sélectionnez le « Type » auquel les objets de la ressource correspondront dans le système, tel que utilisateur, rôle, service, politique, ou objet organisationnel. Ceci détermine comment les objets seront traités et liés aux autres composants du système.\n\nUn « Archétype » est une classification spécialisée qui précise la signification et le comportement d'objets. C'est utilisé pour exprimer une sémantique additionnelle, contrôler la présentation ou appliquer un motif de configuration spécifique. Vous pouvez assigner un archétype existant ou en créer un nouveau si besoin.\n\nPour plus d'information, référez-vous à la <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/#specify-the-midpoint-data">documentation de midPoint</a>.
PageResource.wizard.step.synchronization.reaction.action=Action
PageResource.wizard.step.synchronization.reaction.action.text=Configuration de l'action
ActionStepPanel.subText.moreContent=Dans cette étape, vous spécifiez les actions que midPoint devra effectuer lorsqu'un objet ressource sera évalué comme se trouvant dans la situation définie à l'étape précédente.\n\nCes actions déterminent comment midPoint maintient la consistence entre la ressource et les objets gérés dans le système. Par exemple, midPoint peut ignorer la situation, modifier ou supprimer l'objet dans la ressource, ou mettre à jour l'objet correspondant dans midPoint.\n\nPour plus d'information, référez-vous à la <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/synchronization/#set-up-synchronization-rules">documentation de midPoint</a>.
PageResource.wizard.step.synchronization.reaction.action.subText=Define how midPoint will react to synchronization situation.
PageResource.wizard.step.synchronization.reaction.mainSettings=Configuration principale
PageResource.wizard.step.synchronization.reaction.mainSettings.text=Main reaction configuration
PageResource.wizard.step.synchronization.reaction.mainSettings.subText=Define the main configuration for the reaction.
ReactionMainSettingStepPanel.subText.moreContent=A reaction is triggered when a resource object is evaluated to be in a particular situation during synchronization in midPoint. \n\nSituations describe the state of the object as seen by midPoint, based on how it relates to objects known in the system. For example, an object may be recognized as already linked, newly discovered, deleted on the resource, or in conflict with existing data. \n\nIn this step, you define which situation midPoint will react to. The specific actions that midPoint should perform in response will be configured in the following step. \n\nFor more information, see <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/synchronization/#set-up-synchronization-rules">midPoint documentation</a>.
PageResource.wizard.step.synchronization.reaction.optionalSettings=Paramètres optionnels
PageResource.wizard.step.synchronization.reaction.optionalSettings.text=Optional reaction configuration
PageResource.wizard.step.synchronization.reaction.optionalSettings.subText=Define optional configuration for the reaction. This allows you to further refine the reaction configuration.
ReactionOptionalSettingStepPanel.subText.moreContent=Dans cette étape, vous pouvez ajouter des conditions supplémentaires ou un comportement qui contrôlera plus précisément quand et comment la réaction s'appliquera à midPoint.\n\nPar exemple, vous pouvez limiter la réaction à un canal de synchronisation spécifique (tel que la synchronisation en direct, ou la réconciliation), ou étendre le comportement en utilisant des expressions ou scripts. Ces options sont typiquement utilisées dans des configurations plus avancées où des réactions doivent n'être appliquées que dans certains scénarios particuliers.\n\nPour plus d'information, consultez la <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/synchronization/#set-up-synchronization-rules">documentation midPoint</a>.
