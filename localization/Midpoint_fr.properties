roleMiningExportPanel.business.role.label.help=Les préfixes et suffixes sont optionnels mais peuvent être utiles pour identifier l'objectif ou le champ d'application du rôle (rôle métier). Plusieurs préfixes et suffixes peuvent être spécifiés en utilisant une virgule comme séparateur. Par exemple, un unique préfixe pourrait être « RM_ » tandis que de multiples préfixes pourraient être « RM_,Business- ».
