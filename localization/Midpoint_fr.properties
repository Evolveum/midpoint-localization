roleMiningExportPanel.encryption.key.title=Clé de chiffrement :
roleMiningExportPanel.encryption.key.title.help=Ce champ contient une clé générée aléatoirement, qui sera utilisée pour chiffrer les données exportées. Les paramètres des objets exportés seront chiffrés au moyen de la clé sélectionnée. De la même manière, l'ancien paramètre passe par l'algorithme de chiffrement. Après chiffrement, les anciens identifiants de l'objet sont transformés en UUID (en raison de la validation de l'objet), ce qui fait que les anciens paramètres de l'objet sont anonymisés. La clé est supprimée après l'export ; elle n'est en aucune façon enregistrée par midPoint.
