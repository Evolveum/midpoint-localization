PageConnectorDevelopment.offlineWarning=The connector generation service is not configured, so AI-assisted discovery and script generation are unavailable. The wizard will only produce basic skeleton scripts that must be completed and validated manually.
PageConnectorDevelopment.wizard.step.basicSettings=Paramètres de base
PageConnectorDevelopment.wizard.step.appIdentification=Identification de l'application
PageConnectorDevelopment.wizard.step.appIdentification.text=Identifiez l'application cible
PageConnectorDevelopment.wizard.step.appIdentification.subText=Indiquez à quelle application vous voulez vous connecter. Sur base de cette information, midPoint identifiera le système cible et localisera la documentation appropriée afin de préparer tout le nécessaire pour la génération du connecteur.
PageConnectorDevelopment.wizard.step.connectorWaitingDocumentation=Identification
PageConnectorDevelopment.wizard.step.connectorWaitingDocumentation.text=Identification de la documentation...
PageConnectorDevelopment.wizard.step.connectorWaitingDocumentation.subText=Analyse des détails de votre application cible pour localiser la documentation appropriée.
PageConnectorDevelopment.wizard.step.documentation=Documenation
PageConnectorDevelopment.wizard.step.documentation.text=Fournissez la documentation d'intégration
PageConnectorDevelopment.wizard.step.documentation.subText=La documentation aidera l'IA à comprendre comment votre système communique, quels terminaisons il expose et quelles structures de données il utilise. En analysant cette information, l'IA peut générer un connecteur plus précis, taillé sur mesure pour votre intégration.
PageConnectorDevelopment.wizard.step.connectorIdentification=Identification du connecteur
PageConnectorDevelopment.wizard.step.connectorIdentification.text=Définissez les informations de base concernant le connecteur
PageConnectorDevelopment.wizard.step.connectorIdentification.subText=Dans ce panneau, vous pouvez introduire les détails fondamentaux qui décrivent le connecteur, fournissant ainsi le contexte nécessaire avant d'ajouter de la configuration plus spécifique.
PageConnectorDevelopment.wizard.step.connectorWaitingCreatingConnector=Création du connecteur
PageConnectorDevelopment.wizard.step.connectorWaitingCreatingConnector.text=Création du connecteur...
PageConnectorDevelopment.wizard.step.connectorWaitingCreatingConnector.subText=Nous utilisons les informations de base du connecteur pour créer une instance de test, à des fins de développement et test.
PageConnectorDevelopment.wizard.step.connection=Connexion
PageConnectorDevelopment.wizard.step.sqlConnectionParameters=Paramètres de connexion
PageConnectorDevelopment.wizard.step.sqlConnectionParameters.text=Établissez les paramètres de connexion à la base de données
PageConnectorDevelopment.wizard.step.sqlConnectionParameters.subText=Indiquez l'URL JDBC, le nom d'utilisateur et le mot de passe nécessaires pour vous connecter à la base de données cible, ainsi que d'éventuels pile de connexions ou paramètres de validation optionnels nécessaires.
PageConnectorDevelopment.wizard.step.connectorWaitingBasicInfo=Identification
PageConnectorDevelopment.wizard.step.connectorWaitingBasicInfo.text=Identification des possibilités de connexion...
PageConnectorDevelopment.wizard.step.connectorWaitingBasicInfo.subText=Ceci implique d'explorer et déterminer les options disponibles pour établir une connexion, notamment les protocoles pris en charge, les méthodes d'authentification et les terminaisons.
PageConnectorDevelopment.wizard.step.baseUrl=URL de base
PageConnectorDevelopment.wizard.step.baseUrl.text=Indiquez l'URL de base de l'API.
PageConnectorDevelopment.wizard.step.baseUrl.subText=Introduisez l'URL racine de l'API du système cible ou sélectionnez en une suggérée si disponible. Cette adresse sera utilisée comme point de départ pour toutes les communications entre le connecteur et le système externe. Si la documentation fournit une URL de base valide, vous pouvez utiliser la valeur suggérée ou en introduire un autre manuellement.
PageConnectorDevelopment.wizard.step.supportedAuthMethod=Méthodes d'authentification
PageConnectorDevelopment.wizard.step.supportedAuthMethod.text=Sélectionnez les méthodes d'authentification prises en charge
PageConnectorDevelopment.wizard.step.supportedAuthMethod.subText=Choisissez quelles méthodes d'authentification votre connecteur devrait prendre en charge. Les utilisateurs pourront s'authentifier via n'importe laquelle des méthodes sélectionnées lorsqu'ils utiliseront cette intégration.
PageConnectorDevelopment.wizard.step.connectorWaitingAuthScript=Générer un script d'authentification
PageConnectorDevelopment.wizard.step.connectorWaitingAuthScript.text=Génération d'un script d'authentification...
PageConnectorDevelopment.wizard.step.connectorWaitingAuthScript.subText=Nous créons un script d'authentification fonctionnel basé sur les méthodes d'authentification que le système supporte. Ceci nécessite habituellement quelques secondes.
PageConnectorDevelopment.wizard.step.authScripts=Validation du script d'authentification
PageConnectorDevelopment.wizard.step.authScripts.text=Validation du script d'authentification
PageConnectorDevelopment.wizard.step.authScripts.subText=Cette étape implique d'examiner le script d'authentification pour s'assurer qu'il fonctionne correctement et de façon sécurisée. Vous pouvez vérifier la logique, valider la gestion des informations d'identification et ajuster le script si quoi que ce soit semble incorrect ou peut être amélioré.
PageConnectorDevelopment.wizard.step.testingCredentials=Informations d'identification
PageConnectorDevelopment.wizard.step.testingCredentials.text=Méthode d'authentification pour les tests
PageConnectorDevelopment.wizard.step.testingCredentials.subText=Choisissez une méthode d'authentification pour ce connecteur et complétez les informations d'identification correspondantes pour effectuer des tests. Les champs ci-dessous dépendent de la méthode choisie.
PageConnectorDevelopment.wizard.step.endpointPath=Tester la connexion
PageConnectorDevelopment.wizard.step.endpointPath.text=Fournissez la terminaison à utiliser pour un test de connection
PageConnectorDevelopment.wizard.step.endpointPath.subText=Déterminer la meilleure terminaison pour l'exécution d'une opération de test. Ceci aide à valider que le connecteur peut communiquer avec le système cible et commencer à découvrir les structures de données disponibles.
PageConnectorDevelopment.wizard.step.resourceTest=Connexion
PageConnectorDevelopment.wizard.step.resourceTest.text=Test de la connexion...
PageConnectorDevelopment.wizard.step.resourceTest.subText=Veuillez patienter pendant que nous contrôlons si le connecteur peut atteindre le système distant et recevoir une réponse correcte.
PageConnectorDevelopment.wizard.step.resourceTest.text.success=Connexion réussie
PageConnectorDevelopment.wizard.step.resourceTest.subText.success=Le connecteur a réussi à atteindre le système et a reçu une réponse valide.
PageConnectorDevelopment.wizard.step.resourceTest.text.fails=Connexion ratée
PageConnectorDevelopment.wizard.step.resourceTest.subText.fails=Le connecteur n'a pas pu atteindre le système ou n'a pas reçu de réponse valide.
PageConnectorDevelopment.wizard.step.fixConnection=Corriger : échec de connexion
PageConnectorDevelopment.wizard.step.fixConnection.text=La connexion a échoué
PageConnectorDevelopment.wizard.step.fixConnection.subText=Le test de connexion a échoué en raison d'un souci de configuration, probablement en lien avec le jeton d'authentification. Mettez la configuration à jour et exécutez à nouveau le test.
PageConnectorDevelopment.wizard.step.connectorWaitingConnectivityEndpoint=Terminaisons de connectivité
PageConnectorDevelopment.wizard.step.connectorWaitingConnectivityEndpoint.text=Identification des terminaisons de connectivité
PageConnectorDevelopment.wizard.step.connectorWaitingConnectivityEndpoint.subText=Veuillez patienter pendant que midPoint analyse la configuration de votre connecteur et découvre les terminaisons de connectivité disponibles.
PageConnectorDevelopment.wizard.step.connectorWaitingObjectClass=Identification des classes d'objets
PageConnectorDevelopment.wizard.step.connectorWaitingObjectClass.text=Identification des classes d'objets...
PageConnectorDevelopment.wizard.step.connectorWaitingObjectClass.subText=Analyse de la documentation pour détermine quelles classes d'objets sont gérées par le système connecté.
PageConnectorDevelopment.wizard.step.initObjectClass=Classe d'objets
PageConnectorDevelopment.wizard.step.selectObjectClass=Classes d'objets
PageConnectorDevelopment.wizard.step.selectObjectClass.text=Sélectionnez une classe d'objet à configurer
PageConnectorDevelopment.wizard.step.selectObjectClass.subText=midPoint a analysé votre documentation et trouvé des classes d'objet qui pourraient être disponibles pour intégration. Sélectionnez-en une pour commencer sa configuration.
PageConnectorDevelopment.wizard.step.connectorWaitingObjectClassDetails=Analyse en cours
PageConnectorDevelopment.wizard.step.connectorWaitingObjectClassDetails.text=Analyse de la classe d'objet sélectionnée...
PageConnectorDevelopment.wizard.step.connectorWaitingObjectClassDetails.subText=Cette étape se focalise sur l'examen de la classe d'objet choisie afin d'en comprendre la structure, les attributs et les relations, afin d'assurer quelle puisse être adéquatement intégrée et utilisée au sein du connecteur.
PageConnectorDevelopment.wizard.step.connectorWaitingNativeSchema=Génération d'un script de schéma natif
PageConnectorDevelopment.wizard.step.connectorWaitingNativeSchema.text=Génération d'un script de schéma natif...
PageConnectorDevelopment.wizard.step.connectorWaitingNativeSchema.subText=Nous créons un script de schéma natif fonctionnel basé sur la structure des données des systèmes connectés. Ceci nécessite habituellement quelques secondes.
PageConnectorDevelopment.wizard.step.connectorWaitingFixObjectClass=Réparation de la classe d'objet
PageConnectorDevelopment.wizard.step.connectorWaitingFixObjectClass.text=Réparation de la classe d'objet...
PageConnectorDevelopment.wizard.step.connectorWaitingFixObjectClass.subText=Analyse des erreurs rapportées par midPoint et correction des scripts impactés pour cette classe d'objets. Cette étape peut prendre un certain temps.
PageConnectorDevelopment.wizard.step.connectorWaitingSchema=Découverte du schéma
PageConnectorDevelopment.wizard.step.connectorWaitingSchema.text=Découverte du schéma...
PageConnectorDevelopment.wizard.step.connectorWaitingSchema.subText=Les définitions natives de schéma sont découverts pour le connecteur et la ressource, qui seront utilisées comme documentation pour la génération de code pour le connecteur.
PageConnectorDevelopment.wizard.step.schemaScript=Validation du script de schéma
PageConnectorDevelopment.wizard.step.schemaScript.text=Validation du script de schéma
PageConnectorDevelopment.wizard.step.schemaScript.subText=Cette étape vérifie que le script de schéma est correctement défini et exécutable, de sorte que le connecteur puisse correctement interpréter et traiter la structure de données.
PageConnectorDevelopment.wizard.step.showSchema=Validation de schéma
PageConnectorDevelopment.wizard.step.showSchema.text=Vérifier les attributs du schéma
PageConnectorDevelopment.wizard.step.showSchema.subText=Voyez les attributs du schéma d'objet tel qu'extraits par le script de schéma. Contrôlez si cela concorde bien avec vos attentes.
PageConnectorDevelopment.wizard.step.searchAllEndpoints=Terminaisons pour les opérations de liste d'objets
PageConnectorDevelopment.wizard.step.searchAllEndpoints.text=Sélectionnez les terminaisons pour les opérations de liste d'objets
PageConnectorDevelopment.wizard.step.searchAllEndpoints.subText=Sélectionnez la terminaison à utiliser pour les opérations de recherche. L'assistant peut suggérer des terminaisons ou paramètres par défaut sur base de la documentation disponible. Si aucune suggestion ne convient, spécifiez manuellement une terminaison personnalisée.
PageConnectorDevelopment.wizard.step.connectorWaitingSearchAll=Génération d'un script de listage d'objets
PageConnectorDevelopment.wizard.step.connectorWaitingSearchAll.text=Génération d'un script de listage d'objets...
PageConnectorDevelopment.wizard.step.connectorWaitingSearchAll.subText=La génération du script pour lister les objets est actuellement en cours. Veuillez attendre que le connecteur prépare le script pour validation.
PageConnectorDevelopment.wizard.step.searchAllScript=Validation du script pour lister les objets
PageConnectorDevelopment.wizard.step.searchAllScript.text=Validation du script pour lister les objets
PageConnectorDevelopment.wizard.step.searchAllScript.subText=Cette étape vise à valider le script pour lister les objets, pour vous assurer qu'il récupère et traite correctement tous les objets disponibles depuis le système cible.
PageConnectorDevelopment.wizard.step.showSearchResult=Résultats de recherche
PageConnectorDevelopment.wizard.step.showSearchResult.text=Validez les résultats de recherche
PageConnectorDevelopment.wizard.step.showSearchResult.subText=La table ci-dessous montre les données récupérées au moyen du script de recherche généré. Voyez les résultats pour vous assurer que les attributs corrects sont présents et que les valeurs retournées sont telles qu'attendues. Si tout semble bien, poursuivez en validant afin de finaliser la configuration.
PageConnectorDevelopment.wizard.step.relationship=Relation
PageConnectorDevelopment.wizard.step.searchByIdEndpoints=Terminaisons pour les opérations d'obtention d'objets
PageConnectorDevelopment.wizard.step.searchByIdEndpoints.text=Sélectionnez les terminaisons pour les opérations d'obtention d'objets
PageConnectorDevelopment.wizard.step.searchByIdEndpoints.subText=Sélectionnez la terminaison à utiliser pour les opérations d'obtention d'objet. L'assistant peut suggérer des terminaisons ou paramètres par défaut sur base de la documentation disponible. Si aucune suggestion ne convient, spécifiez manuellement une terminaison personnalisée.
PageConnectorDevelopment.wizard.step.connectorWaitingSearchById=Génération du script d'obtention d'objet
PageConnectorDevelopment.wizard.step.connectorWaitingSearchById.text=Génération du script d'obtention d'objet...
PageConnectorDevelopment.wizard.step.connectorWaitingSearchById.subText=La génération du script "Obtenir un objet" est actuellement en cours. Veuillez attendre que le connecteur prépare le script pour validation.
PageConnectorDevelopment.wizard.step.searchByIdScript=Validation du script d'obtention d'objet
PageConnectorDevelopment.wizard.step.searchByIdScript.text=Validation du script d'obtention d'objet
PageConnectorDevelopment.wizard.step.searchByIdScript.subText=Cette étape valide le script d'obtention d'objet pour vous assurer qu'il récupère et traite correctement un objet du système cible sur base de son identifiant.
PageConnectorDevelopment.wizard.step.showSearchByIdResult=Résultats de l'obtention d'objet
PageConnectorDevelopment.wizard.step.showSearchByIdResult.text=Validez les résultats de l'obtention d'objet
PageConnectorDevelopment.wizard.step.showSearchByIdResult.subText=Voici une liste d'objets. Cliquez sur le nom de l'un des objets trouvés pour voir ses détails et ainsi tester le script d'obtention d'objets. Si tout semble bon, poursuivez en validant pour finaliser la configuration.
PageConnectorDevelopment.wizard.step.searchFilterEndpoints=Terminaisons pour les opérations de filtre de recherche
PageConnectorDevelopment.wizard.step.searchFilterEndpoints.text=Sélectionnez les terminaisons pour les opérations de filtre de recherche
PageConnectorDevelopment.wizard.step.searchFilterEndpoints.subText=Sélectionnez la terminaison à utiliser pour les opérations de filtre de recherche. L'assistant peut suggérer des terminaisons ou paramètres par défaut sur base de la documentation disponible. Si aucune suggestion ne convient, spécifiez manuellement une terminaison personnalisée.
PageConnectorDevelopment.wizard.step.connectorWaitingSearchFilter=Génération d'un script de filtre de recherche
PageConnectorDevelopment.wizard.step.connectorWaitingSearchFilter.text=Génération d'un script de filtre de recherche...
PageConnectorDevelopment.wizard.step.connectorWaitingSearchFilter.subText=La génération du script "Filtre de recherche" est actuellement en cours. Veuillez attendre que le connecteur prépare le script pour validation.
PageConnectorDevelopment.wizard.step.searchFilterScript=Validation du script de filtre de recherche
PageConnectorDevelopment.wizard.step.searchFilterScript.text=Validation du script de filtre de recherche
PageConnectorDevelopment.wizard.step.searchFilterScript.subText=Cette étape valide le script de filtre de recherche pour vous assurer qu'il récupère et traite correctement les object du système cible dont les caractéristiques concordent aux critères du filtre.
PageConnectorDevelopment.wizard.step.showSearchFilterResult=Résultats du filtre de recherche
PageConnectorDevelopment.wizard.step.showSearchFilterResult.text=Validez les résultats du filtre de recherche
PageConnectorDevelopment.wizard.step.showSearchFilterResult.subText=La table ci-dessous montre les données récupérées au moyen du script de filtre de recherche généré. Voyez les résultats pour vous assurer que les attributs corrects sont présents et que les valeurs retournées sont telles qu'attendues. Si tout semble bon, poursuivez en validant afin de finaliser la configuration.
PageConnectorDevelopment.wizard.step.Relationship=Relation
PageConnectorDevelopment.wizard.step.selectRelationship=Sélectionner une relation
PageConnectorDevelopment.wizard.step.selectRelationship.text=Sélectionnez une relation à ajouter
PageConnectorDevelopment.wizard.step.selectRelationship.subText=Sélectionnez la relation que vous voulez inclure. Les éléments prêts sont ajoutés immédiatement. Pour les schémas ou attributs manquants ou en conflit, vous serez guidé dans la configuration et la validation des détails ; après confirmation, la configuration de la relation sélectionnée se poursuit.
PageConnectorDevelopment.wizard.step.connectorWaitingRelationshipScript=Génération d'un script de relations
PageConnectorDevelopment.wizard.step.connectorWaitingRelationshipScript.text=Génération d'un script de relations...
PageConnectorDevelopment.wizard.step.connectorWaitingRelationshipScript.subText=Préparation des scripts nécessaires pour gérer les relations sélectionnées et résoudre les situations où quelque chose viendrait à manquer.
PageConnectorDevelopment.wizard.step.relationshipScript=Valider le script de relations
PageConnectorDevelopment.wizard.step.relationshipScript.text=Validez le script de relations qui a été généré
PageConnectorDevelopment.wizard.step.relationshipScript.subText=Voyez le script de relations généré et confirmez s'il représente correctement les relations avant de poursuivre.
PageConnectorDevelopment.wizard.step.nextSteps=Étapes suivantes
PageConnectorDevelopment.wizard.step.nextSteps.text=Que faire ensuite ?
PageConnectorDevelopment.wizard.step.nextSteps.subText=Vous avez configuré avec succès la fonctionnalité de recherche de base pour les types d'objet Utilisateur. Sur base de votre progrès, voici quelques étapes suivantes recommandées pour étendre et finaliser la configuration de votre connecteur.
PageConnectorDevelopment.wizard.step.createEndpoints=Terminaisons pour les opérations de création
PageConnectorDevelopment.wizard.step.createEndpoints.text=Sélectionnez les terminaisons pour les opérations de création
PageConnectorDevelopment.wizard.step.createEndpoints.subText=Sélectionner une terminaison à utiliser pour les opérations de création. L'assistant peut suggérer des terminaisons de création par défaut ou des paramètres basés sur la documentation disponible. Si aucune suggestion n'est appropriée, vous pouvez manuellement spécifier une terminaison personnalisée pour les créations.
PageConnectorDevelopment.wizard.step.connectorWaitingCreate=Génération d'un script de création
PageConnectorDevelopment.wizard.step.connectorWaitingCreate.text=Génération d'un script de création...
PageConnectorDevelopment.wizard.step.connectorWaitingCreate.subText=La génération du script de création est actuellement en cours. Veuillez attendre que le connecteur prépare le script pour validation.
PageConnectorDevelopment.wizard.step.createScript=Validation du script de création
PageConnectorDevelopment.wizard.step.createScript.text=Validation du script de création
PageConnectorDevelopment.wizard.step.createScript.subText=Cette étape valide le script de création pour confirmer qu'il récupère et traite correctement tous les objets disponibles du système cible.
PageConnectorDevelopment.wizard.step.objectClassCreate=Opération de création
PageConnectorDevelopment.wizard.step.deleteEndpoints=Terminaisons pour les opérations de suppression
PageConnectorDevelopment.wizard.step.deleteEndpoints.text=Sélectionnez les terminaisons pour les opérations de suppression
PageConnectorDevelopment.wizard.step.deleteEndpoints.subText=Sélectionner une terminaison à utiliser pour les opérations de suppression. L'assistant peut suggérer des terminaisons de suppression par défaut ou des paramètres basés sur la documentation disponible. Si aucune suggestion n'est appropriée, vous pouvez manuellement spécifier une terminaison personnalisée pour les suppressions.
PageConnectorDevelopment.wizard.step.connectorWaitingDelete=Génération d'un script de suppression
PageConnectorDevelopment.wizard.step.connectorWaitingDelete.text=Génération d'un script de suppression...
PageConnectorDevelopment.wizard.step.connectorWaitingDelete.subText=La génération du script "Supprimer" est actuellement en cours. Veuillez attendre que le connecteur prépare le script pour validation.
PageConnectorDevelopment.wizard.step.deleteScript=Validation du script de suppression
PageConnectorDevelopment.wizard.step.deleteScript.text=Validation du script de suppression
PageConnectorDevelopment.wizard.step.deleteScript.subText=Cette étape valide le script de suppression pour confirmer qu'il récupère et traite correctement tous les objets disponibles du système cible.
PageConnectorDevelopment.wizard.step.objectClassDelete=Opération de suppression
PageConnectorDevelopment.wizard.step.updateEndpoints=Terminaisons pour les opérations de mise à jour
PageConnectorDevelopment.wizard.step.updateEndpoints.text=Sélectionnez les terminaisons pour les opérations de mise à jour
PageConnectorDevelopment.wizard.step.updateEndpoints.subText=Sélectionnez la terminaison à utiliser pour les opérations de mise à jour. L'assistant peut suggérer des terminaisons ou paramètres par défaut sur base de la documentation disponible. Si aucune suggestion ne convient, spécifiez manuellement une terminaison personnalisée.
PageConnectorDevelopment.wizard.step.connectorWaitingUpdate=Génération d'un script de mise à jour
PageConnectorDevelopment.wizard.step.connectorWaitingUpdate.text=Génération d'un script de mise à jour...
PageConnectorDevelopment.wizard.step.connectorWaitingUpdate.subText=La génération du script "Mettre à jour" est actuellement en cours. Veuillez attendre que le connecteur prépare le script pour validation.
PageConnectorDevelopment.wizard.step.updateScript=Validation du script de mise à jour
PageConnectorDevelopment.wizard.step.updateScript.text=Validation du script de mise à jour
PageConnectorDevelopment.wizard.step.updateScript.subText=Cette étape valide le script de mise à jour pour confirmer qu'il récupère et traite correctement toues les objets disponibles du système cible.
PageConnectorDevelopment.wizard.step.objectClassUpdate=Opération de mise à jour
PageConnectorDevelopment.wizard.step.objectClassSearchAll=Opération de listage d'objets
PageConnectorDevelopment.wizard.step.objectClassSearchById=Opération d'obtention d'objet
PageConnectorDevelopment.wizard.step.objectClassSearchFilter=Opération de filtre de recherche
PageConnectorDevelopment.wizard.step.objectClassSchema=Opération de schéma
PageConnectorDevelopment.wizard.step.connectorWaitingExportingConnector=Export du connecteur
PageConnectorDevelopment.wizard.step.connectorWaitingExportingConnector.text=Export du connecteur...
PageConnectorDevelopment.wizard.step.connectorWaitingExportingConnector.subText=Nous conditionnons le paquet du connecteur en un fichier JAR téléchargeable, prêt à être installé dans une autre instance de midPoint.
PageConnectorDevelopment.wizard.step.connectorWaitingUploadingConnector=Mise à jour du connecteur
PageConnectorDevelopment.wizard.step.connectorWaitingUploadingConnector.text=Mise à jour du connecteur...
PageConnectorDevelopment.wizard.step.connectorWaitingUploadingConnector.subText=Nous conditionnons le paquet du connecteur, sans ses dépendances, pour un usage ailleurs.
