CorrelationWizardPanelWizardPanel.breadcrumb=Corrélation
CorrelationWizardPanelWizardPanel.text=Règles de corrélation
CorrelationWizardPanelWizardPanel.subText=La corrélation est un mécanisme utilisé pour corréler les objets des ressources avec des objets existant dans midPoint. Vous pouvez définir une ou plusieurs règles de corrélation au moyen de différents éléments et poids pour influencer la concordance automatique, tandis que les cas ambigus pourront être vérifiés et résolus manuellement.
CorrelationItemsTableWizardPanel.subText.moreContent=La corrélation est utilisée pour éviter de créer des doublons d'identités en intégrant des données de systèmes externes. Elle procède par comparaison des attributs de l'objet ressource avec les données déjà stockées dans midPoint.\n\nPar exemple, un compte utilisateur issu d'une ressource peut être corrélé avec une identité existante sur base de la concordance entre des attributs tels que le nom d'utilisateur ou l'adresse de courriel. Vous pouvez définir une ou plusieurs règles de corrélation faisant appel à divers éléments et poids relatifs pour gérer la concordance automatique, tout en laissant les cas ambigus pour vérification et résolution manuelles.\n\nPour plus d'information, référez-vous à la <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/correlation/">documentation de midPoint</a>.
