PageCertDefinition.outcomeStrategyHelpLabel=Viz také
PageCertDefinition.outcomeStrategyHelpLink=tento dokument
PageCertDefinition.outcomeStrategyHelp=Jak je určen celkový výstup pro daný případ, v závislosti na výstupech jednotlivých fází? Poznámka: položka "Zastavit ověření na/v:" ukazuje výstupy, které zabraňují danému případu, aby postoupil do další fáze. Obvykle není třeba výchozí hodnotu měnit. Pokud to je nezbytné, je to možné udělat přes XML konfiguraci.
PageCertDefinition.campaignLastStartedHelp=Kdy byla naposledy spuštěna kampaň vytvořená z této definice?
PageCertDefinition.campaignLastClosedHelp=Kdy byla naposledy ukončena kampaň vytvořená z této definice? Bez ohledu na to, zda skončila průchodem všemi fázemi, nebo byla ukončena v průběhu. Poznámka: Kampaně, které byly smazány bez toho, že by byly předem ukončeny, v tomto seznamu zobrazeny nejsou
PageCertDefinition.scopeObjectTypeHelp=Určuje, jaké objekty budou zváženy pro zahrnutí do rozsahu této kampaně. Níže jsou vybrány rysy těchto objektů (jako zda certifikovat jejich přiřazení, jejich indukce, nebo oboje)
PageCertDefinition.scopeSearchFilterHelp=Pokud je pro certifikaci zvažována jen podmnožina objektů daného typu, můžete zde specifikovat odpovídající filtr. Například můžete specifikovat, že pouze uživatelé z určité organizace by měli být certifikováni. Nebo, že by měli být zvažováni pouze zaměstnanci s definovaným typem zaměstnance.
PageCertDefinition.scopeAssignmentsInducementsHelp=Vybrat, které rysy objektů popsaných výše (přiřazení, indukce nebo oboje) jsou certifikovány.
PageCertDefinition.scopeIncludeTargetTypesHelp=Když jsou certifikovány přiřazení nebo indukce, můžete určit jaké cílové typy jsou použity. Například, můžete určit, že chcete certifikovat pouze přiřazení rolí (uživatelům).
PageCertDefinition.scopeIncludeByStatusHelp=Zda se mají certifikovat pouze přiřazení či indukce, která mají administrativní status nastaven na Povoleno (či nijak nenastaven). Poznámka: důležitý je zde administrativní status přiřazení, ne administrativní status přiřazeného objektu.
PageCertDefinition.scopeRelationHelp=Vztahy, které jsou zvažovány. Hodnota q:any znamená "jakýkoliv vztah". Pokud není zvolen žádný vztah, předpokládá se org:default (null).
StageDefinitionPanel.stageDurationHelp=Trvání této fáze, použité k určení konce fáze. Čas konce fáze je počítán jako okamžik otevření fáze plus doba trvání, zaokrouhleno na čas 23:59:59 posledního dne. <br />Trvání se specifikuje v ISO 8601 formátu, například: P14D = 14 dní, P3W = 3 týdny, P2M = 2 měsíce, a podobně.
StageDefinitionPanel.notifyBeforeDeadlineHelp=Jak dlouho před koncem fáze se mají posílat upozornění (ověřovatelům a vlastníkovi kampaně). Lze zadat více hodnot oddělených čárkou. Trvání je zadáváno ve formátu ISO 8601, například PT12H pro 12 hodin, P2D pro 2 dny, P1W pro jeden týden a podobně.<br/>Například, PT48H, PT12H znamená, že první upozornění se pošle 48 hodin před koncem fáze, následované druhým upozorněním 12 hodin před koncem fáze.
StageDefinitionPanel.notifyWhenNoDecisionHelp=Pokud je zaškrtnuto, je upozornění o blížícím se konci fáze zasláno ověřovateli, a to jen tehdy, pokud nějaké případy čekají na jeho/její rozhodnutí. <br /> Pokud není zaškrtnuto, ověřovatelé dostanou upozornění vždy - bez ohledu na to, zda provedli rozhodnutí, nebo ne. (Poznámka: vlastník kampaně dostane upozornění na blížící se konec fáze vždy, bez ohledu na toto nastavení)
StageDefinitionPanel.reviewerSpecificationTargetHelp=Výběr ověřovatelů na základě cílového vlastníka/schvalovatele přiřazení/indukce. Například lze určit, že vlastník role certifikuje všechna přiřazení "své" role (komukoli).
StageDefinitionPanel.reviewerSpecificationObjectHelp=Výběr ověřovatelů na základě objektu, ke kterému je něco přiřazeno (či indukováno). Například lze určit, že vlastník role certifikuje všechna indukce "své" role.
StageDefinitionPanel.reviewerUseObjectManagerHelp=Výběr ověřovatelů na základě manažerů objektu (typicky uživatele), kteří mají něco přiřazeno či indukováno. Například lze určit, že manažer se používá k certifikaci všech přiřazení pro uživatele ve "své" organizaci.
StageDefinitionPanel.reviewerUseObjectManagerOrgTypeHelp=Vlivy určují manažera uživatele: <br />Nejprve jsou vzati v potaz všichni manažeři všech organizací, do kterých uživatel patří. Uživatel sám je vyloučen, pokud v takové organizaci je manažerem (a pokud není zvolena volba "Povolit manažerům schvalovat svá vlastní přiřazení"). <br />Pokud je hodnota v tomto poli vyplněna, je použita pro výběr organizací s daným typem - například "funkční" (pokud například v modelu existují "funkční" a "projektové" organizace). <br />Pokud v tomto není uvedena žádná hodnota, jsou vzaty v potaz všechny organizace. <br />\nPokud není nalezen žádný vhodný manažer, pokračuje se v nadřazené organizaci (stejného typu, je-li uveden).
StageDefinitionPanel.reviewerUseObjectManagerAllowSelfHelp=Pokud je uživatel manažer v organizaci, může být vybrán jako ověřovatel svých vlastních přiřazení? \nVe výchozím nastavení není zvoleno, což znamená, že je hledán manažer na vyšší pozici (viz popis odpovídajícího pole).
StageDefinitionPanel.defaultReviewerRefHelp=Tento ověřovatel (ověřovatelé) bude použit, pokud podmínce uvedené výše nebude odpovídat žádný ověřovatel.
StageDefinitionPanel.additionalReviewerRefHelp=Tento ověřovatel (ověřovatelé) bude použit navíc k ověřovatelům. kteří byli vybráni na základě ostatních podmínek.
StageDefinitionPanel.outcomeStrategyHelp=Pokud je vybrán více jak jeden ověřovatel, jak mají být kombinovány jejich odpovědi do výsledků této fáze? <br />\nNapříklad, je dostatečné, pokud jeden z nich potvrdí certifikační případ, nebo je třeba, aby potvrdili všichni? Toto pole vybírá odpovídající strategii.
StageDefinitionPanel.outcomeIfNoReviewersHelp=Jaký má být výsledek, pokud nejsou přiřazeni žádní ověřovatelé? Toto může nastat například tehdy, pokud je ověřovatel definován jako vlastník cílové role, ale daná role nemá žádného vlastníka. <br />\nPoznámka: toto pravidlo nezastupuje případy, kdy ověřovatelé přiřazeni sice jsou, ale žádný z nich neodpoví.
StageDefinitionPanel.stopReviewOnHelp=Jaký vystup zabrání danému případu, aby postoupil do další fáze certifikace? <br /> Typicky není třeba výchozí hodnotu měnit. Pokud to však je žádoucí, je možné ji změnit přes XML konfiguraci.
StageDefinitionPanel.configurationHelpLabel=Pro více informací o konfiguraci certifikační kampaně viz též
StageDefinitionPanel.configurationHelpLink=tento dokument
NameStep.configurationWillBeLost=Vybrané schéma konfigurace konektoru je odlišné od současného. Vlastnosti původní konfigurace budou ztraceny.
resultsHandlerConfiguration=Obsluhy události (handler) výsledků
enableFilteredResultsHandler=Povolit přídavné filtrování výsledků
enableFilteredResultsHandlerHelp=Tato obsluha události (handler) filtruje výsledky načtené ze systému konektorem na úrovni frameworku konektoru. Používají ji implementace konektorů, které samy o sobě neposkytují úplné filtrování. Zapnutí této obsluhy události (handler) má některé nevýhody, např. v oblasti stránkování. Má se tedy používat jen tehdy, je-li to opravdu nutné. Pokud si nejste jisti, je vhodné použít filtrování v režimu ověřování. Výchozí hodnota pro aktuální verzi ConnId: vypnuto.
filteredResultsHandlerInValidationMode=Vykonávat filtrování pouze ve validačním režimu
filteredResultsHandlerInValidationModeHelp=Přepíná filtrování výsledků do validačního režimu: všechna data konektoru jsou ověřována frameworkem konektoru pro zajištění, že byla správně filtrována. V případě nesprávného filtrování je vygenerována výjimka. Tento mód je používán konektory, od kterých se očekává kompletní pokrytí oblasti filtrování, a proto je třeba zverifikovat jejich funkčnost v této oblasti. Výchozí hodnota pro aktuální verzi ConnId: zakázáno.
enableCaseInsensitiveFilter=Ignorovat ve filtrování rozdíl mezi velkým a malým písmenem
enableCaseInsensitiveFilterHelp=Tato volba zapne ignorování velikosti písmen ve filtrování, pro všechny atributy ze systému. Používá se pro systémy, které nerozlišují mezi velikostí písmen. Výchozí hodnota pro aktuální verzi ConnId: zakázáno.
enableNormalizingResultsHandler=Povolit, aby obsluha události (handler) normalizoval vrácená data
enableNormalizingResultsHandlerHelp=Tato obsluha události (handler) normalizuje každý atribut, který je předán ze systému do Identity Manageru. Obvykle se doporučuje vypnout. Výchozí hodnota pro aktuální verzi ConnId: vypnuto.
enableAttributesToGetSearchResultsHandler=Povolit obsluze události (handler) 'získání atributů - attributes to get'
enableAttributesToGetSearchResultsHandlerHelp=Tato obsluha události (handler) slouží k implementaci možnosti „atributy k získání“. Výchozí hodnota: vypnuto.
