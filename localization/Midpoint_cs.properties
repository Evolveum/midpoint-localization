PartialConfigurationStepPanel.subText.moreContent=Tato nastavení určují, jakým způsobem midPoint komunikuje se systémem, který je touto konfigurací reprezentován. Obvykle zahrnují umístění (např. hostitele nebo URL) a pověření používaná k autentizaci. \n\nKonfigurace závisí na zvoleném konektoru a schopnostech cílového systému. Ujistěte se, že zadaný účet má dostatečná oprávnění pro operace, které má midPoint provádět — například čtení objektů, vytváření účtů nebo úpravu atributů. \n\nVíce informací naleznete v <a href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/#establish-a-connection" target="_blank">dokumentaci midPointu</a>.
PageResource.wizard.step.discovery=Prozkoumání
PageResource.wizard.step.discovery.title=Objevené možnosti
PageResource.wizard.step.discovery.text=MidPoint prozkoumání (discovery)
PageResource.wizard.step.discovery.subText=Systém prošel procesem prozkoumání (discovery) a midPoint nalezl následující konfigurační parametry.
DiscoveryStepPanel.subText.moreContent=Prozkoumání (discovery) usnadňuje konfiguraci tím, že analyzuje vzdálený systém a navrhuje konfiguraci připojení a dostupné schopnosti. Zkontrolujte objevené parametry a ověřte, že správně odpovídají vašemu systému. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/#midpoint-discovery">dokumentaci midPointu</a>.
PageResource.wizard.step.selectObjectClasses=Schéma systému
PageResource.wizard.step.selectObjectClasses.text=Schéma systému
PageResource.wizard.step.selectObjectClasses.subText=Vyberte třídy objektů, na které má být midPoint omezen; jinak budou dostupné všechny třídy objektů. Pokud si nejste jisti, ponechte výchozí nastavení.
SelectObjectClassesStepPanel.subText.moreContent=Výběr tříd objektů umožňuje omezit rozsah integrace systému. Zvolením konkrétních tříd určíte, které objekty jsou relevantní pro synchronizaci apod. \n\nPokud si nejste jisti, které třídy vybrat, ponechání výchozího výběru je obvykle dostačující pro většinu nastavení a umožní systému fungovat v midPointu se standardním chováním. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/#schema-of-object-types">dokumentaci midPointu</a>.
PageResource.wizard.step.objectType.basicSettings=Základní informace
PageResource.wizard.step.objectType.basicSettings.text=Základní informace o objektovém typu
PageResource.wizard.step.objectType.basicSettings.subText=Popište zamýšlený účel typu objektu. Typ objektu určuje, jakým způsobem midPoint zpracovává konkrétní druh objektu v systému (např. účet nebo oprávnění).
BasicSettingResourceObjectTypeStepPanel.subText.moreContent=Typ objektu představuje logickou kategorii objektů v systému a určuje, jakým způsobem midPoint s těmito objekty nakládá. Tato definice slouží k vyjádření zamýšlené role typu objektu v rámci konfigurace vašeho systému. \n\nJedná se o konfiguraci na vysoké úrovni, která pomáhá sladit chování systému s tím, jakým způsobem má midPoint spravovat různé druhy objektů. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/#basic-attributes">dokumentaci midPointu</a>.
PageResource.wizard.step.objectType.delineation=Data systému
PageResource.wizard.step.objectType.delineation.text=Specifikujte data systému
PageResource.wizard.step.objectType.delineation.subText=Definujte objekty v systému, které patří (jsou klasifikovány) pod tento typ objektu. Objekty lze určit buď pouze pomocí třídy objektu, nebo s využitím dalších vlastností objektu v systému.
DelineationResourceObjectTypeStepPanel.subText.moreContent=Tento krok umožňuje zúžit množinu objektů, které bude midPoint zpracovávat pod tímto typem objektu. Ve výchozím nastavení jsou objekty vybírány na základě třídy objektu. V případě potřeby lze výběr dále zpřesnit pomocí filtrů nebo výrazů založených na vlastnostech objektu v systému, aby lépe odpovídal zamýšlené konfiguraci. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/#specify-the-resource-data">dokumentaci midPointu</a>.
PageResource.wizard.step.objectType.focus=Data midPointu
PageResource.wizard.step.objectType.focus.text=Specifikujte data midPointu
PageResource.wizard.step.objectType.focus.subText=Definujte Typ (a volitelně Archetyp), který bude v midPointu reprezentovat objekty v systému klasifikované pod tímto typem objektu.
FocusResourceObjectTypeStepPanel.subText.moreContent=Vyberte „Typ", kterému budou objekty ze systému odpovídat v rámci Identity Manageru — například uživatel, role, služba, politika nebo organizační objekt. Tato volba určuje, jak jsou objekty zpracovávány a jak souvisejí s ostatními částmi Identity Manageru. \n\n„Archetyp" je specializovaná klasifikace, která dále zpřesňuje význam a chování objektů. Slouží k vyjádření dalších sémantických pravidel, řízení zobrazení nebo uplatnění konkrétních konfiguračních vzorů. Můžete přiřadit existující archetype nebo v případě potřeby vytvořit nový. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/#specify-the-midpoint-data">dokumentaci midPointu</a>.
PageResource.wizard.step.synchronization.reaction.action=Akce
PageResource.wizard.step.synchronization.reaction.action.text=Konfigurace akce
ActionStepPanel.subText.moreContent=V tomto kroku určujete akce, které má midPoint provést, pokud je u objektu v systému vyhodnocena situace definovaná v předchozím kroku. \n\nTyto akce určují, jakým způsobem midPoint udržuje konzistenci mezi systémem a objekty spravovanými v midPointu. Například midPoint může situaci ignorovat, upravit nebo odstranit objekt v systému, případně aktualizovat odpovídající objekt v midPointu. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/synchronization/#set-up-synchronization-rules">dokumentaci midPointu</a>.
PageResource.wizard.step.synchronization.reaction.action.subText=Definujte, jak bude midPoint reagovat na synchronizační situaci.
PageResource.wizard.step.synchronization.reaction.mainSettings=Hlavní konfigurace
PageResource.wizard.step.synchronization.reaction.mainSettings.text=Hlavní konfigurace reakce
PageResource.wizard.step.synchronization.reaction.mainSettings.subText=Definujte hlavní konfiguraci reakce.
ReactionMainSettingStepPanel.subText.moreContent=Reakce je spuštěna, když je u objektu v systému během synchronizace v midPointu vyhodnocena určitá situace. \n\nSituace popisují stav objektu tak, jak ho vidí midPoint, na základě vztahu k objektům, které zná. Objekt může být například rozpoznán jako již propojený, nově objevený, smazaný v systému nebo v konfliktu s existujícími daty. \n\nV tomto kroku definujete, na kterou situaci bude midPoint reagovat. Konkrétní akce, které má midPoint v reakci provést, se konfigurují v následujícím kroku. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/synchronization/#set-up-synchronization-rules">dokumentaci midPointu</a>.
PageResource.wizard.step.synchronization.reaction.optionalSettings=Volitelná nastavení
PageResource.wizard.step.synchronization.reaction.optionalSettings.text=Volitelné nastavení reakce
PageResource.wizard.step.synchronization.reaction.optionalSettings.subText=Definujte volitelnou konfiguraci reakce. Umožňuje další zpřesnění nastavení reakce.
ReactionOptionalSettingStepPanel.subText.moreContent=V tomto kroku můžete přidat další podmínky nebo chování, které blíže určují, kdy a jak se reakce v midPointu uplatní. \n\nLze například omezit reakci na konkrétní synchronizační kanál (například live synchronizaci nebo rekonciliaci), případně rozšířit chování pomocí výrazů nebo skriptů. Tyto možnosti se obvykle využívají v pokročilejších konfiguracích, kdy se reakce mají uplatnit pouze v určitých situacích. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/synchronization/#set-up-synchronization-rules">dokumentaci midPointu</a>.
