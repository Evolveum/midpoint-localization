BasicInformationResourceStepPanel.subText.moreContent=Pole „Název" identifikuje systém v rámci midPointu; mělo by být jedinečné a jasně označovat systém, který reprezentuje. \n\nPole „Fáze životního cyklu" určuje, zda je systém připravený k použití. Systém lze například ponechat ve stavu Proposed (navrženo), dokud nedokončíte konfiguraci připojení, zpracování schématu, mapování nebo jiných integračních detailů. Jakmile je konfigurace hotová a ověřená pomocí simulací, můžete systém přepnout do stavu Active (aktivní), aby bylo možné ho využívat pro provisioning a synchronizaci.\n\nVíce informací naleznete v <a href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/#basic-information" target="_blank">dokumentaci midPointu</a>.
