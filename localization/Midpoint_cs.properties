CorrelationItemsTableWizardPanel.notShownContainer=Systém obsahuje typy korelátorů, které průvodce nezobrazuje. Průvodce může zobrazit pouze korelátory založené na inteligentních položkách.
CorrelationWizardPanelWizardPanel.breadcrumb=Korelace
CorrelationWizardPanelWizardPanel.text=Korelační pravidla
CorrelationWizardPanelWizardPanel.subText=Korelace je mechanismus používaný ke korelaci objektů systému se stávajícími objekty midPointu. Můžete definovat jedno nebo více korelačních pravidel s použitím různých položek a vah pro podporu automatického párování, přičemž nejednoznačné případy lze zkontrolovat a vyřešit ručně.
CorrelationItemsTableWizardPanel.subText.moreContent=Korelace se používá, aby se při integraci dat z externích systémů zabránilo vytváření duplicitních identit. Funguje tak, že porovnává atributy objektů systému s daty již uloženými v midPointu. \n\nNapříklad uživatelský účet přicházející ze systému může být korelován se stávající identitou porovnáním atributů, jako je uživatelské jméno nebo e-mailová adresa. Můžete definovat jedno nebo více korelačních pravidel s použitím různých položek a vah pro podporu automatického párování, přičemž nejednoznačné případy lze zkontrolovat a vyřešit ručně. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/correlation/">dokumentaci midPointu</a>.
