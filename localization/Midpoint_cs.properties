roleMiningExportPanel.encryption.key.title=Šifrovací klíč:
roleMiningExportPanel.encryption.key.title.help=Toto pole obsahuje náhodně vygenerovaný klíč, který se použije k zašifrování exportovaných dat. Parametry exportovaných objektů budou zašifrovány pomocí vybraného klíče. Stejným způsobem prochází šifrovacím algoritmem i parametr oid. Po zašifrování jsou identifikátory objektů (oid) transformovány na UUID (kvůli validaci objektů), což má za následek, že parametry oid objektů jsou anonymizovány. Klíč je po exportu zahozen, midPoint jej nijak nezaznamenává.
