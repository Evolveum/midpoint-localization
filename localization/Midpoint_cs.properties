SchemaHandlingStep.label.protected=Chráněný
SchemaHandlingStep.limitations.tooltip.ignore=Příznak, že atribut má být ignorován. Systém bude předstírat, že ignorovaný atribut vůbec neexistuje. Nebude zobrazen v uživatelském rozhraní, nebudou se na něj aplikovat mapování a podobně.
SchemaHandlingStep.limitations.tooltip.layers=Systémová vrstva, na kterou se toto omezení aplikuje. Někdy se omezení neaplikuje rovnoměrně na všechny vrstvy. Například, atribut může být formálně v režimu pro čtení i zápis, ale je žádáno, aby byl v uživatelském rozhraní pouze ke čtení, a měnil se jen pomocí mapování. V takovém případě se omezení na pouze čtení aplikuje na vrstvu "presentation".
SchemaHandlingStep.limitations.tooltip.maxOccurs=Největší počet výskytů atributu.  Hodnota "jedna" znamená jedinou hodnotu atributu, hodnota "neomezeno" ("unbounded") znamená vícehodnotový atribut. Hodnota, které je uvedena zde, přepíše hodnotu ze schématu systému.
SchemaHandlingStep.limitations.tooltip.minOccurs=Nejmenší počet výskytů atributu.  Hodnota "nula" znamená volitelný atribut, hodnota "jedna" znamená povinný atribut. Hodnota, které je uvedena zde, přepíše hodnotu ze schématu systému.
SchemaHandlingStep.limitations.tooltip.other=TODO: ODEBRAT TENTO TOOLTIP
SchemaHandlingStep.limitations.tooltip.propertyAccess=Typ přístupu, který je povolen či zakázán.
SchemaHandlingStep.mapping.tooltip.authoritative=Autoritativní mapování vkládají i odebírají uvedenou hodnotu.  Neautoritativní mapování jenom přidávají hodnotu.  Například: pokud role s autoritativním mapováním je odstraněna, potom hodnota, která je na základě této role nastavena, je také odstraněna.
SchemaHandlingStep.mapping.tooltip.channel=Omezuje použití tohoto mapování na určitý kanál. Například na změny přicházející z live synchronizace, rekonciliaci nebo uživatelské rozhraní - GUI. Pokud je uveden kanál, potom je mapování provedeno. Pokud kanál uveden není, potom se žádná omezení neaplikují a mapování je provedeno nad všemi kanály.
SchemaHandlingStep.mapping.tooltip.conditionLanguage=Programovací jazyk, ve kterém je napsán skript podmínky.
SchemaHandlingStep.mapping.tooltip.condition=XML reprezentace podmínky mapování. Toto je skutečný kód výrazu, který bude vykonán. Zdroje mapování jsou uvedeny jako vstupní proměnné podmínky. Pokud je podmínka pravdivá, potom je mapování aplikováno. Pokud není pravdivá, potom je mapování ignorováno. Je dobré si uvědomít, že mapování, které bylo pravdivé a stala se nepravdivým, může vést k odebrání hodnoty, která byla výsledkem mapování, dokud ještě platilo.
SchemaHandlingStep.mapping.tooltip.conditionType=Typ výrazu, který je použit v mapovací podmínce.
SchemaHandlingStep.mapping.tooltip.conditionValuePolicyRef=Odkaz na objekt politiky hodnoty. Uvedená politika hodnoty bude použita jako šablona pro vygenerování hodnoty. Pokud není uveden odkaz na politiku hodnoty, pak je určena výchozí politika automaticky. Například bude použita odpovídající politika hesel, vhodná pro cíl mapování.
SchemaHandlingStep.mapping.tooltip.exceptChannel=Omezuje použití tohoto mapování na všechny kanály kromě uvedeného. Například, všechny změny kromě těch přicházejících z live synchronizace, rekonciliace nebo uživatelského rozhraní (GUI). Pokud je kanál uveden, potom mapování nebude na tento kanál použito. Pokud není uveden, potom použito bude. Pokud není uveden žádný kanál, potom nejsou v platnosti žádná omezení a mapování se použije na všechny kanály.
SchemaHandlingStep.mapping.tooltip.exclusive=Výhradní mapování může být jediné mapování, které určuje hodnotu pro daný cíl. Pokud například jiné mapování definuje hodnotu pro stejný atribut, potom skončí přiřazení chybou.
SchemaHandlingStep.mapping.tooltip.expressionLanguage=Programovací jazyk, ve kterém je napsán skript výrazu.
SchemaHandlingStep.mapping.tooltip.expression=XML reprezentace podmínky mapování. Toto je skutečný kód výrazu, který bude vykonán. Zdroje mapování jsou uvedeny jako vstupní proměnné podmínky. Návratová hodnota výrazu je použita na cíl mapování.
SchemaHandlingStep.mapping.tooltip.expressionType=Typ výrazu použitý v mapování. Pokud není uveden žádný výraz, potom je použit "asis" výraz.
SchemaHandlingStep.mapping.tooltip.expressionValuePolicyRef=Odkaz na objekt politiky hodnoty. Uvedená politika hodnoty bude použita jako šablona pro vygenerování hodnoty. Pokud není uveden odkaz na politiku hodnoty, pak je určena výchozí politika automaticky. Například bude použita odpovídající politika hesel, vhodná pro cíl mapování.
SchemaHandlingStep.mapping.tooltip.source=Zdroj mapování. Mapování reaguje na změny ve zdrojích mapování. Hodnoty zdrojů jsou vstupními parametry výrazu uvnitř mapování.
SchemaHandlingStep.mapping.tooltip.strength=Síla, s jakou je mapování provedeno. Slabé mapování je provedeno pouze tehdy, pokud cíl mapování ještě neobsahuje žádnou hodnotu. Normální mapování je provedno pouze pokud byl zdroj mapování změněn. Silné mapování se provede vždy.
SchemaHandlingStep.mapping.tooltip.target=Cíl mapování. Hodnota, kterou mapování vytvoří, je zapsána do cíle mapování.
SchemaHandlingStep.message.errorLoadingObjectTypeList=Nepodařilo se načíst seznam tříd objektů ze systému. Chyba:
SchemaHandlingStep.message.saveError=Nepodařilo se uložit zpracování schématu, {0}
SchemaHandlingStep.message.selectObjectClassAss=Nastavte atribut 'Třída objektu' před tím, než vytvoříte asociaci systému.
SchemaHandlingStep.message.selectObjectClassAttr=Nastavte atribut 'Třída objektu' před tím, než vytvoříte atribut systému.
SchemaHandlingStep.message.validationError=Vložená hodnota třídy objektu: '{0}' není správná. Nastavte správnou hodnotu třídy objektu.
