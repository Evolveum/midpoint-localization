SchemaHandlingStep.title=Zpracování schématu
SchemaHandlingStep.tooltip.activation=Popis jak mapovat aktivační stavy (povolený/zakázaný/archivovaný) a data (platnost od a do).
SchemaHandlingStep.tooltip.assignmentPolicyRef=Politika přiřazení popisuje, jak přísně jsou přiřazení vynucována.<ul>\n<li><tt>Žádná</tt> - přiřazení nejsou vynucována vůbec</li><li><tt>Kladná</tt> - přiřazení pouze přidávají hodnoty (nikdy neodebírají)</li><li><tt>Relativní</tt> - propagovány jsou jenom změny, stávající hodnoty jsou ponechány nedotčeny</li><li><tt>Plná</tt> - vše je přísně vynuceno (jak změněné, tak stávající hodnoty).</li></ul>
SchemaHandlingStep.tooltip.associations=Popis, jak jsou zpracovány asociace oprávnění.
SchemaHandlingStep.tooltip.attributes=Popis, jak jsou zpracovány jednotlivé atributy. Každá definice může obsahovat příchozí/odchozí mapování, omezení atributů, a podobně.
SchemaHandlingStep.tooltip.credentials=Popis, jak zpracovat pověření, jako jsou například hesla.
SchemaHandlingStep.tooltip.default=Pokud je zapnuto, potom je tato definice výchozí pro svůj druh. To znamená, že pokud není výslovně specifikován žádný záměr, potom bude použita tato definice.
SchemaHandlingStep.tooltip.dependency=Závislosti jsou typy objektů, které musí být zpracovány před tím, než jsou zpracovány tyto objektové typy. To znamená, že tento objektový typ na nich závisí. Nad typy objektů, na kterých tento objektový typ závisí, bude proveden provisioning před tímto objektovým typem. Závislosti se používají proto, aby ustanovily pořadí operací provisioningu.
SchemaHandlingStep.tooltip.filterClause=TODO: SchemaHandlingStep.tooltip.filterClause
SchemaHandlingStep.tooltip.intent=Záměr specifikuje, co by měl systém s objektem dělat. Záměr rozřazuje objekty stejného druhu do několika kategorií. Objekty s rozlišnými záměry mohou být zpracovány systémem odlišně.
SchemaHandlingStep.tooltip.iteration=Postupně hledá hodnoty pro jedinečné atributy jako jsou identifikátory. Systém {0} zkusí několikrát opakovaně najít unikátní hodnotu pro takové atributy.
SchemaHandlingStep.tooltip.kind=Druh specifikuje, co je objekt zač - zda je to účet, oprávnění nebo něco jiného.
SchemaHandlingStep.tooltip.objectClass=Třída objektu ze schématu, která bude použita k vytvoření instancí tohoto typu objektu.
SchemaHandlingStep.tooltip.protected=Specifikace chráněných instancí tohoto typu objektu. Systém tyto chráněné instance vidí, ale nemůže je měnit. Jakýkoliv pokus o jejich úpravu selže. Tohoto se obvykle používá pro ochranu nouzových administrativních účtů, jako je "root", nebo "administrator".
