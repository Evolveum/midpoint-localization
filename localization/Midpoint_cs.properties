InternalsMemoryPanel.text.explanation=Aby bylo možno získat informace o Java paměti typu heap, je zapotřebí nástroje <b>jmap</b> a/nebo <b>jhsdb</b> z JDK.  Buď jej lze nalézt na cestě v operačním systému, ve složce "$JAVA_HOME/bin", nebo jsou výslovně zmíněny v souboru "config.xml" v klíčích "midpoint.system.jmap" / "midpoint.system.jhsdb" a nebo jsou nadefinovány jako proměnné systému "midpoint.system.jmap" / "midpoint.system.jhsdb". Alternativní způsob je nastavit příslušné příkazy přes vlastnosti <b>heapInfoCommand</b> a <b>heapObjectsHistogramCommand</b> v systémové konfiguraci v kontejneru <b>internals/memoryDiagnostics</b>.
