CreateResourceChoiceTemplatePanel.text=Vytvořit nový systém
CreateResourceChoiceTemplatePanel.subText=Systém představuje externí zdrojový nebo cílový systém spravovaný midPointem, např. LDAP adresář, databázi nebo softwarovou aplikaci. Prostřednictvím systémů může midPoint číst, vytvářet, upravovat a deaktivovat účty a další objekty.
CreateResourceChoiceTemplatePanel.subText.moreContent=Pro urychlení konfigurace a zajištění konzistence můžete nový systém založit na existující šabloně systému. \n\nVolba „Zdědit šablonu" udržuje systém propojený se šablonou – budoucí změny šablony se promítnou i do tohoto systému. \n\nVolba „Kopírovat ze šablony" použije šablonu pouze jako výchozí bod; po vytvoření je systém nezávislý. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/create-resource-using-wizard/">dokumentaci midPointu</a>.
