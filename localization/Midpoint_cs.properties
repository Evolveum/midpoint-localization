PageTask.wizard.step.execution.subText=Zadejte možnosti spouštění úlohy. Určete, zda má úloha provést změny (Full) nebo pouze simulovat operace pro pozdější analýzu. Pro simulaci použijte Náhled nebo Náhled na řízení stínových účtů - pouze stínová simulace (např. korelační pravidla,...). Zadejte také Konfiguraci, kterou chcete použít: Produkční, chcete-li použít pouze aktivní konfiguraci systému, nebo Vývojovou, chcete-li použít aktivní a navrhovanou konfiguraci systému během simulace.
PageTask.wizard.step.execution.subText.shadow=Zadejte možnosti provedení úlohy. Určete, zda má úloha provést změny (Plný přepočet) nebo pouze simulovat operace pro pozdější analýzu. Pro simulaci použijte náhled na řízení stínových účtů - pouze simulace stínových účtů (např. korelační pravidla,...). Zadejte také Konfiguraci, která se má použít: Pro simulaci použijte konfiguraci: Production - chcete-li použít pouze aktivní konfiguraci systému, nebo Development - chcete-li použít aktivní a navrhovanou konfiguraci systému.
