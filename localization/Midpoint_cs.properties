ResourceWizard.help.capabilityStep=<p>To, co externí systém umí, popisují jeho <i>schopnosti</i>. Ne všechny systémy jsou v tomto směru rovny — jeden může podporovat aktivaci účtu (povolení a zakázání), zatímco druhý ne. Jeden poskytuje přístup pro čtení i zápis, jiný jen pro čtení. Liší se také v podpoře synchronizace v reálném čase. Možností je více. <i>Schopnosti</i> popisují, co konkrétní systém umí, aby se k němu midPoint mohl chovat odpovídajícím způsobem.</p><p>Všechny schopnosti mohou být <i>zakázané</i> (tj. vypnuté). Zakázání schopnosti způsobí, že midPoint nebude používat tuto část konektoru nebo systému. Schopnosti jsou obvykle zakázány v případě, že jsou chybové. Například pokud je chyba v konektoru nebo na systému, je možné ji obejít tím, že příslušná schopnost je zakázaná. Schopnosti však mohou být vypnuté i z administrativních důvodů. Například zakázáním schopností <tt>Vytvořit</tt>, <tt>Aktualizovat</tt> a <tt>Smazat</tt> se systém efektivně přepne do režimu pouze ke čtení.</p><p>Některé schopnosti mohou být <i>simulovány</i>. To znamená, že midPoint bude předstírat, že systém danou schopnost má, ačkoli tomu tak není. Například schopnost <i>activation</i> může být simulována nastavením specifického atributu účtu. Takto simulovaná schopnost obvykle vyžaduje dodatečnou konfiguraci. Ta je dostupná na této stránce.</p><p>Více informací je k dispozici na <a href="https://wiki.evolveum.com/display/midPoint/Resource+Capabilities">wiki stránce Resource Capabilities (anglicky)</a>.</p>
ResourceWizard.help.configurationStep=<p>Tato fáze průvodce konfiguruje vlastnosti konfigurace konektoru. Tyto vlastnosti obvykle určují síťové parametry použité pro přístup k systému, jako je název hostitele a čísla portů. Dalšími síťovými parametry, které zde mohou být konfigurovány, jsou například časové limity pro síťové operace a konfigurace fondu spojení. </p><p>vlastnosti konfigurace konektoru jsou unikátní pro každý konektor. Specifická sada konfiguračních vlastností je určena dle konfiguračního schématu konektoru. Proto tedy obsah této stránky odvisí od typu konektoru, který byl zvolen.</p>
ResourceWizard.help.nameStep=<p>Tato fáze konfiguračního průvodce konfiguruje základní vlastnosti připojovaného systému. Lze zde konfigurovat název a popis systému. Název konektoru je povinný, a musí být unikátní. Konektor, který bude použit pro připojení k systému, musí být taktéž nakonfigurován. Konektory se rozmísťují na hostitele konektorů. Pokud konektorový hostitel není vyplněn, potom jsou použity konektory rozmístěné přímo na instanci midPointu.</p><p>Detailní popis konfigurace systému je k k dispozici na <a href="https://wiki.evolveum.com/display/midPoint/Resource+Configuration">wiki stránce Resource Configuration (anglicky)</a>.</p>
ResourceWizard.help.schemaHandlingStep=<p>Tento krok se používá ke <b>konfiguraci</b> zpracování schématu systému. Konfigurace, která je zobrazena na této stránce, říká midPointu <b>co dělat</b> s atributy a třídami objektů systému. Obsahuje konfiguraci mapování mezi užívatelskými vlastnostmi a atributy účtu, konfiguraci typů účtu, skupin, závislostí provisioningu, mapování hesel a podobně.</p><p>Tato konfigurace je seskupena do <b>typů objektů</b>. Každý typ objektu definuje chování specifického typu účtu, typu oprávnění, OU atd. Typ objektu je jednoznačně identifikován kombinací <i>kind</i> a <i>intent</i>. <i>Kind</i> definuje, jakým druhem objekt je:<ul><li>kind=<tt>account</tt> znamená, že objekt je účet, tj., že představuje uživatele.</li><li>kind=<tt>entitlement</tt> je aplikován na skupiny, role, privilegia, ACI a podobné objekty, které mohou být asociovány s účty a které dávají účtu privilegia nebo práva k přístupu.</li><li>kind=<tt>generic</tt> se aplikuje na ostatní objekty, jako jsou organizační jednotky (OU), domény a podobně.</li></ul><i>Intent</i> je prostý řetězec, který může být použit pro rozlišení různých typů objektů. Například může být použit pro odlišení některých typů účtů, jako je "výchozí uživatelský účet", "administrativní účet", "testovací účet" a podobně. Více informací je k dispozici na <a href="https://wiki.evolveum.com/display/midPoint/Kind%2C+Intent+and+ObjectClass">wiki stránce Kind, Intent and ObjectClass (anglicky)</a>.</p><p>Podrobnější popis konfigurace zpracování schématu je k dispozici na <a href="https://wiki.evolveum.com/display/midPoint/Resource+Schema+Handling">wiki stránce Resource Schema Handling (anglicky)</a>.</p>
ResourceWizard.help.schemaStep=<p>Tato stránka zobrazuje schéma systému. Schéma systému definuje <i>třídy objektů</i>, které umí konektor spravovat, například účty, skupiny, organizační jednotky a podobně. Schéma definuje pro každou třídu objektu sadu <i>atributů</i>. Schema je zde zobrazeno jen k náhledu, abyste jej mohli prozkoumat a seznámit se s datovým modelem, který systém poskytuje.</p><p>Schéma systému předložené na této stránce je obvykle navráceno ze systému a automaticky vygenerováno midPointem. Schéma systému popisuje to, co systém <b>může dělat</b>, které třídy objektů definuje a jaké atributy jsou použity v třídách objektů. Proto je schéma pouze k náhledu. Toto <b>není</b> konfigurace. Schéma <b>ne</b>definuje, jak midPoint používá objektové třídy a atributy. Toto se definuje v dalším kroku tohoto průvodce.</p><p>Podrobnější vysvětlení konceptu schématu systému je k dispozici na <a href="https://wiki.evolveum.com/display/midPoint/Resource+Schema">wiki stránce Resource Schema (anglicky)</a>.</p>
ResourceWizard.help.synchronizationStep=<p>Konfigurace synchronizace definuje, co {0} udělá, když rozpozná, že objekt v systému se změnil. Konfigurace například popisuje, jak midPoint reaguje na nový účet, když rozpozná, že skupina, která by měla existovat, neexistuje, a podobně. Obvykle nezáleží na způsobu, jak byla změna objevena, reakce je obvykle stejná (ačkoli výjimky jsou možné specifikováním <i>kanálu</i>). Proto politika nakonfigurovaná zde, obvykle platí pro <i>live synchronizaci</i>, <i>rekonciliaci</i>, <i>import</i>, <i>prozkoumávání</i> (mechanismus konzistence) a další možné mechanismy, které mohou být v budoucnu implementovány.</p><p>Více podrobností je k dispozici na <a href="https://wiki.evolveum.com/display/midPoint/Synchronization+Configuration">wiki stránce Synchronization Configuration (anglicky)</a>.
