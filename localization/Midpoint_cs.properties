SynchronizationReactionTableWizardPanel.text=Synchronizace
SynchronizationReactionTableWizardPanel.subText=Definujte synchronizační reakce. Tato konfigurace určuje akce, které midPoint provede nad objekty v systému v konkrétních situacích — například když jsou objekty v systému vytvořeny nebo smazány mimo midPoint.
SynchronizationReactionTableWizardPanel.subText.moreContent=Synchronizace umožňuje midPointu rozpoznávat změny, k nimž dochází přímo v systému, a reagovat na ně. Když jsou během synchronizace objekty objeveny nebo změněny, midPoint vyhodnotí jejich situaci a uplatní nakonfigurované reakce. \n\nPokud je například v systému nalezen nový účet, midPoint ho může propojit s existující identitou, vytvořit novou, nebo případ označit k ručnímu posouzení. Identity v midPointu tak zůstávají konzistentní se skutečným stavem připojených systémů. \n\nVíce informací naleznete v <a target="_blank" href="https://docs.evolveum.com/midpoint/reference/admin-gui/resource-wizard/object-type/synchronization/">dokumentaci midPointu</a>.
SynchronizationReactionTableWizardPanel.saveButton=Uložit nastavení synchronizace
SynchronizationReactionTableWizardPanel.headerLabel=Seznam reakcí
SynchronizationStep.action.tooltip.handlerUri=Výslovná akce k vykonání. Je dobré mít na zřeteli, že většina akcí je navržena tak, aby pracovala s výchozím synchronizačním algoritmem systému {0} a že tento algoritmus bude spouštěn, dokud toto není výslovně zakázáno (potom ale výsledek operace může být chyba). Také je dobré mít na zřeteli to, že i pokud  není žádná výslovná akce zvolena, systém bude stále spouštět  výchozí synchronizační algoritmus, pokud byla vybrána volba "synchronizovat".
SynchronizationStep.action.tooltip.order=Určuje, zda je výslovná akce provedena před, nebo po výchozím synchronizačním algoritmu systému {0}. Většina vestavěných akcí je navržena tak, aby byla vykonávána před synchronizací, protože pouze nastavují kontext modelu a pak teprve systém dělá skutečnou práci. Některé akce však mohou vyžadovat spuštění až po synchronizaci, například zasílání notifikací, začištění a podobně.
