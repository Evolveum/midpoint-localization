PageTask.wizard.step.schedule.subText=Zadejte možnosti plánování úlohy. Pokud chcete, aby se úloha spouštěla pravidelně, zadejte níže uvedené možnosti. Pokud se má úloha spustit pouze jednou, nemusíte zadávat žádné hodnoty.
