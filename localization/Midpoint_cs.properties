CorrelationItemRefsTable.column.threshold.help=Hraniční hodnota Levenshteinovy vzdálenosti nebo míry podobnosti trigramů, po jejímž dosažení jsou data považována za shodná. V prvním případě se jedná o horní hranici (tj. za shodné se považují pouze míry Levenshteinovy vzdálenosti na této hodnotě nebo pod ní), zatímco v druhém případě se jedná o dolní hranici (tj. za shodné se považují míry trigramové podobnosti na této hodnotě nebo nad ní).
