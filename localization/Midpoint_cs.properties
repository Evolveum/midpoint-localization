PageConnectorDevelopment.wizard.step.basicSettings=Základní nastavení
PageConnectorDevelopment.wizard.step.appIdentification=Identifikace aplikace
PageConnectorDevelopment.wizard.step.appIdentification.text=Identifikujte cílovou aplikaci
PageConnectorDevelopment.wizard.step.appIdentification.subText=Uveďte, ke které aplikaci se chcete připojit. Na základě této informace midPoint identifikuje cílový systém a dohledá odpovídající dokumentaci, aby připravil vše potřebné pro vygenerování konektoru.
PageConnectorDevelopment.wizard.step.connectorWaitingDocumentation=Identifikuji
PageConnectorDevelopment.wizard.step.connectorWaitingDocumentation.text=Identifikuji dokumentaci…
PageConnectorDevelopment.wizard.step.connectorWaitingDocumentation.subText=Analyzujeme detaily cílové aplikace, abychom dohledali správnou dokumentaci.
PageConnectorDevelopment.wizard.step.documentation=Dokumentace
PageConnectorDevelopment.wizard.step.documentation.text=Poskytněte integrační dokumentaci
PageConnectorDevelopment.wizard.step.documentation.subText=Dokumentace umožňuje AI pochopit, jakým způsobem systém komunikuje, které koncové body vystavuje a jaké datové struktury používá. Analýzou těchto informací může AI vygenerovat přesnější a lépe přizpůsobený konektor pro vaši integraci.
PageConnectorDevelopment.wizard.step.connectorIdentification=Identifikace konektoru
PageConnectorDevelopment.wizard.step.connectorIdentification.text=Zadejte základní informace o konektoru
PageConnectorDevelopment.wizard.step.connectorIdentification.subText=Na tomto panelu lze zadat základní údaje popisující konektor a poskytnout tak potřebný kontext před doplněním podrobnější konfigurace.
PageConnectorDevelopment.wizard.step.connectorWaitingCreatingConnector=Vytvářím konektor
PageConnectorDevelopment.wizard.step.connectorWaitingCreatingConnector.text=Vytvářím konektor…
PageConnectorDevelopment.wizard.step.connectorWaitingCreatingConnector.subText=Ze základních údajů konektoru vytvoříme testovací instanci pro účely vývoje a testování.
PageConnectorDevelopment.wizard.step.connection=Spojení
PageConnectorDevelopment.wizard.step.sqlConnectionParameters=Connection parameters
PageConnectorDevelopment.wizard.step.sqlConnectionParameters.text=Set Database Connection Parameters
PageConnectorDevelopment.wizard.step.sqlConnectionParameters.subText=Enter the JDBC URL, username and password used to connect to the target database, plus any optional connection pool or validation settings you need.
PageConnectorDevelopment.wizard.step.connectorWaitingBasicInfo=Identifikace
PageConnectorDevelopment.wizard.step.connectorWaitingBasicInfo.text=Identifikuji možnosti připojení…
PageConnectorDevelopment.wizard.step.connectorWaitingBasicInfo.subText=Zahrnuje to průzkum a určení dostupných možností navázání připojení, včetně podporovaných protokolů, metod autentizace a koncových bodů.
PageConnectorDevelopment.wizard.step.baseUrl=Specifikace základní URL
PageConnectorDevelopment.wizard.step.baseUrl.text=Nastavte základní URL API
PageConnectorDevelopment.wizard.step.baseUrl.subText=Zadejte kořenovou URL API cílového systému, případně vyberte některé z navržených, pokud jsou k dispozici. Tato adresa bude sloužit jako výchozí bod pro veškerou komunikaci mezi konektorem a externím systéme. Pokud dokumentace poskytla platnou základní URL, můžete použít navrženou hodnotu, nebo zadat adresu ručně.
PageConnectorDevelopment.wizard.step.supportedAuthMethod=Podporované metody autentizace
PageConnectorDevelopment.wizard.step.supportedAuthMethod.text=Vyberte podporované metody autentizace
PageConnectorDevelopment.wizard.step.supportedAuthMethod.subText=Zvolte, které metody autentizace má konektor podporovat. Uživatelé se pak budou moci při použití této integrace autentizovat kteroukoli z vybraných možností.
PageConnectorDevelopment.wizard.step.connectorWaitingAuthScript=Generuji autentizační skript
PageConnectorDevelopment.wizard.step.connectorWaitingAuthScript.text=Generuji autentizační skript…
PageConnectorDevelopment.wizard.step.connectorWaitingAuthScript.subText=Vytváříme funkční autentizační skript na základě metod autentizace, které systém podporuje. Obvykle to trvá několik sekund.
PageConnectorDevelopment.wizard.step.authScripts=Validace autentizačního skriptu
PageConnectorDevelopment.wizard.step.authScripts.text=Validace autentizačního skriptu
PageConnectorDevelopment.wizard.step.authScripts.subText=V tomto kroku se prověřuje autentizační skript, aby bylo ověřeno, že funguje správně a bezpečně. Můžete zkontrolovat jeho logiku, ověřit způsob práce s pověřeními (credentials) a v případě nesrovnalostí nebo možnosti vylepšení skript upravit.
PageConnectorDevelopment.wizard.step.testingCredentials=Změna hesla
PageConnectorDevelopment.wizard.step.testingCredentials.text=Metoda autentizace pro testování
PageConnectorDevelopment.wizard.step.testingCredentials.subText=Zvolte metodu autentizace pro tento konektor a vyplňte odpovídající pole s pověřeními (credentials) pro testování. Pole níže se změní podle zvolené metody.
PageConnectorDevelopment.wizard.step.endpointPath=Testovat spojení
PageConnectorDevelopment.wizard.step.endpointPath.text=Zadejte koncový bod pro test připojení
PageConnectorDevelopment.wizard.step.endpointPath.subText=Určete nejvhodnější koncový bod pro provedení testovací operace. Umožňuje to ověřit, že konektor dokáže komunikovat s cílovým systémem a začít objevovat dostupné datové struktury.
PageConnectorDevelopment.wizard.step.resourceTest=Připojuji
