SchemaHandlingStep.activation.tooltip.fetchStrategy=Jak získat atributy, když jsou potřeba. Výchozí nastavení: atribut je normálně vrácen, není třeba jej vyžádávat. Výslovné nastavení: atribut normálně není vrácen, je třeba o něj vždy výslovně žádat.
SchemaHandlingStep.activation.tooltip.inbound=Příchozí mapování mapuje hodnoty ze systému (obvykle z účtu) do {0} (obvykle do identity).
SchemaHandlingStep.activation.tooltip.outbound=Odchozí mapování mapuje hodnoty z {0} (obvykle z uživatele) do systému (obvykle do účtu).
SchemaHandlingStep.association.label.associationName=Název asociace
SchemaHandlingStep.association.label.associationNamespace=Jmenný prostor
SchemaHandlingStep.association.tooltip.associationAttribute=Název atributu, který "váže" asociaci. Tj. atribut, který obsahuje identifikátor asociovaného objektu. Obvykle se jedná o atribut jako "member", "groups", "roles" a podobně. \nV asociaci subjektu na objekt je toto atribut subjektu (například atribut "groups"). V asociaci objektu na subjekt je toto atribut objektu (například skupinový atribut "members").
SchemaHandlingStep.association.tooltip.associationLocalPart=TODO: SchemaHandlingStep.association.tooltip.associationLocalPart
SchemaHandlingStep.association.tooltip.associationNamespace=TODO: SchemaHandlingStep.association.tooltip.associationNamespace
SchemaHandlingStep.association.tooltip.direction=Určuje směr asociace. <br />\nAsociace objektu na subjekt: Objekt (například skupina) má atribut, který obsahuje identifikátor subjektu (například účtu). <br/>\nAsociace subjektu na objekt: Subjekt (například účet) má atribut, který obsahuje identifikátor objektu (například skupiny).
SchemaHandlingStep.association.tooltip.explicitRefIntegrity=Výslovná referenční integrita. <br />Pokud je vypnuto, potom Identity Manager předpokládá, že systém obsahuje referenční integritu. Identity Manager tak například předpokládá, že systém automaticky aktualizuje asociační identifikátory, pokud je účet přejmenován a Identity Manager se tedy nemusí o nic starat.<br/>Pokud je zapnuto, potom Identity Manager dělá výslovnou referenční integritu. V tomto případě Identity Manager výslovně aktualizuje asociační atributy, pokud je účet přejmenován.
SchemaHandlingStep.association.tooltip.intent=Záměr asociace cílového typu objektu. Cílový druh a záměr určuje typ objektu, který je cílem asociace - například skupinu, privilegium, role, a podobně.
SchemaHandlingStep.association.tooltip.kind=Druh asociace cílového typu objektu. Obvykle se jedná o "entitlement" (oprávnění). Cílový druh a záměr určuje typ objektu, který je cílem asociace - například skupinu, privilegium, role, a podobně.
SchemaHandlingStep.association.tooltip.valueAttribute=Název atributu, který je zdrojem hodnoty pro asociaci. Hodnota atributu bude načtena a uložena do asociačního atributu aby tak utvořila asociaci. Toto je obvykle atribut, který obsahuje identifikátor nebo jméno účtu, jako jsou "uid", "id", "name" a podobně. V asociaci subjektu na objekt je toto atribut objektu (například skupiny). V asociaci objektu na subjekt je toto atribut subjektu (například účtu).
SchemaHandlingStep.attribute.label.attributeName=Název atributu
SchemaHandlingStep.attribute.label.attributeNamespace=Prostor názvů atributu
SchemaHandlingStep.attribute.tooltip.allow=Pokud je zapnuta, dovoluje tato volba specifikovat atributy, které nejsou v původním schématu systému. Toto může být využito k opravě chybných konektorů, které neposkytují kompletní schéma systému, nebo které schovávají některé atributy a podobně.
SchemaHandlingStep.attribute.tooltip.attributeLocalPart=TODO: SchemaHandlingStep.attribute.tooltip.attributeLocalPart
SchemaHandlingStep.attribute.tooltip.attributeNamespace=TODO: SchemaHandlingStep.attribute.tooltip.attributeNamespace
SchemaHandlingStep.attribute.tooltip.exclusiveStrong=Pokud je vypnuto, potom hodnoty pro silné a obvyklé mapování jsou sloučeny, aby vytvořily výslednou sadu hodnot. Pokud je povoleno, potom jsou použity pouze hodnoty silného mapování, pokud existuje aspoň jedno silné mapování. V případě, že silné mapování neexistuje, jsou použity normální hodnoty.
SchemaHandlingStep.attribute.tooltip.fetchStrategy=Jak získat atributy, když jsou potřeba. Výchozí nastavení\: atribut je normálně vrácen, není třeba jej vyžádávat. Výslovné nastavení: atribut normálně není vrácen, je třeba o něj vždy výslovně žádat.
SchemaHandlingStep.attribute.tooltip.inbound=Příchozí mapování mapuje hodnoty ze systému (obvykle z účtu) do midPointu (obvykle do uživatele).
SchemaHandlingStep.attribute.tooltip.intolerantVP=Hodnota, která odpovídá tomuto vzoru, NEBUDE tolerována. To znamená, že taková hodnota atributu bude vymazána i když není výsledkem systémového zpracování (mapování).
SchemaHandlingStep.attribute.tooltip.limitations=Specifikuje omezení atributu, jako je násobnost, možnost jeje číst, či do něj zapisovat, a podobně.
SchemaHandlingStep.attribute.tooltip.matchingRule=Pravidlo, které určuje, zda dva atributy mají stejný význam. Například nastavení na 'stringIgnoreCase' způsobí, že tento atribut nebude rozlišovat mezi velkými a malými písmeny.
SchemaHandlingStep.attribute.tooltip.outbound=Odchozí mapování mapuje hodnoty z midPointu (obvykle z uživatele) do systému (obvykle do účtu).
SchemaHandlingStep.attribute.tooltip.reference=Název atributu, který se bude konfigurovat. Všechna nastavení a mapování se budou aplikovat na tento atribut.
SchemaHandlingStep.attribute.tooltip.tolerant=Tolerantní atributy dovolují hodnoty, které jsou nastaveny mimo Identity Manager. Netolerantní atributy povolí pouze hodnoty, které jsou definovány v Identity Manageru (například mapováním systému nebo role).
SchemaHandlingStep.attribute.tooltip.tolerantVP=Hodnota, která odpovídá tomuto vzoru, bude tolerována. To znamená, že taková hodnota atributu zůstane nastavena i když není výsledkem systémového zpracování (mapování).
SchemaHandlingStep.button.add=Přidat typ objektu
SchemaHandlingStep.credentials.tooltip.fetchStrategy=Jak získat hodnotu pověření, když je potřeba. Výchozí nastavení: atribut je normálně vrácen, není třeba jej vyžádávat. Výslovné nastavení: atribut normálně není vrácen, je třeba o něj vždy výslovně žádat.
SchemaHandlingStep.credentials.tooltip.inbound=Příchozí mapování mapuje hodnoty ze systému (obvykle z účtu) do Identity Manageru (obvykle do uživatele).
SchemaHandlingStep.credentials.tooltip.outbound=Odchozí mapování mapuje hodnoty z Identity Manageru (obvykle z uživatele) do systému (obvykle do účtu).
SchemaHandlingStep.credentials.tooltip.passwordPolicyRef=Politika hesel, která se aplikuje na toto pověření. Toto nastavení přebije jiná nastavení, například výchozí politiku hesel definovanou v systémové konfiguraci. Pokud politika hesel definována není, použije se obvykle výchozí politika hesel.
SchemaHandlingStep.dependency.tooltip.intent=Záměr objektu, na kterém se závisí.
SchemaHandlingStep.dependency.tooltip.kind=Druh objektu, na kterém se závisí.
SchemaHandlingStep.dependency.tooltip.order=Obvykle nula. Zde je možné zadat celé číslo, které určuje řazení závislostí které tvoří kruh, a nemohly by jinak být rozhodnuty (takzvané závislosti vyššího řádu).
SchemaHandlingStep.dependency.tooltip.resourceRef=Systém, na kterém závisíme.
SchemaHandlingStep.dependency.tooltip.strictness=Určuje, jak přísně mají být závislosti rozhodovány. Vágní (laxní): pokud závislost neexistuje, pokračuj jako obvykle (používá se pouze pro uložení řazení operací); Uvolněný: odmítne operaci, dokud není nejprve prověřena závislosti, ale pokud toto selže, pokračuje jako obvykle; Přísné: pokračovat pouze pokud je nejprve prověřena závislost a toto uspěje.
SchemaHandlingStep.iteration.tooltip.maxIteration=Největší počet opakování, které se mají zkoušet. Operace skončí neúspěšně, pokud bude bez úspěchu vyzkoušen největší počet opakování.
SchemaHandlingStep.iteration.tooltip.returnMultiplicity=TODO: SchemaHandlingStep.iteration.tooltip.returnMultiplicity
SchemaHandlingStep.iteration.tooltip.variable=TODO: SchemaHandlingStep.iteration.tooltip.variable
