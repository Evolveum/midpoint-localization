ChangePasswordPanel.helpInfo=<p>Tato část dialogu pověření řídí způsob, jakým bude změna hesla propagována do každého jednotlivého systému. První řádka definuje, zda bude heslo změněno v samotném systému {0}. Další řádky představují každý systém, pro který bude heslo změněno. Propagování hesla se řídí těmito ikonkami: </p><ul><li><span class="fa fa-check-square-o"/>Heslo bude změněno. Heslo pro tento systém bude změněno na hodnotu uvedenou v políčku pro heslo.</li><li><span class="fa fa-sign-out"/> Automatická propagace hesla. Heslo může být změněno. Zda heslo změněno bude či nikoli, závisí na politice nastavené správcem identit. Toto obvykle značí, že heslo bude změněno, pokud to v dané situaci a nastavení dává smysl. Toto je rozumná výchozí volba.</li><li><span class="fa fa-square-o"/> Heslo v tomto systému změněno nebude.</li><li><span class="fa fa-square"/> Řízení hesla není podporováno tímto systémem. Ve výsledku heslo v tomto systému změněno nebude. </li></ul><p>Můžete změnit nastavení propagace hesla kliknutím na danou ikonku. Tímto způsobem můžete nastavovat, jak přesně se má heslo do každého systému propagovat.</p>
