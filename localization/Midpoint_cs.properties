SynchronizationStep.message.unsupportedActionFormat=Používáte zastaralý atribut 'ref' pro definici reakce. Místo toho použijte element 'handlerUri'. Akce s atributem 'ref' v tomto průvodci nebudou zobrazeny.
SynchronizationStep.reaction.tooltip.action=Výslovná akce. Toto nastavení udává, co systém provede jako reakci na synchronizační událost.
SynchronizationStep.reaction.tooltip.channel=Omezení kanálu. Pokud synchronizační situace pochází z tohoto konkrétního kanálu (například live synchronizace, rekonciliace nebo import), potom bude provedena odpovídající reakce . Jinak je situace ignorována.
SynchronizationStep.reaction.tooltip.objectTemplateRef=Šablona objektu, která je použita pro zpracování této konkrétní synchronizační události. Pokud není zvolena žádná šablona objektu, potom bude použita obvyklá výchozí volba.
SynchronizationStep.reaction.tooltip.reconcile=Pokud je zapnuto, potom bude pro tuto synchronizační událost rekonciliační krok vynucen. Atributy budou výslovně získány, pokud nejsou přítomny. <br />\nPokud je vypnuto, potom bude rekonciliace automatická. V takovém případě se rekonciliace uděje pouze tehdy, pokud budou v synchronizační události atributy přítomny. Pokud atributy přítomny nejsou, nebudou výslovně získávány a reonciliace bude přeskočena.
SynchronizationStep.reaction.tooltip.situation=Synchronizační situace. Pokud situace události odpovídá situaci určené zde, potom bude provedena odpovídající reakce . Jinak je situace ignorována.
SynchronizationStep.reaction.tooltip.synchronize=Pokud je zapnuto, potom budou uplatněny obvyklé synchronizační algoritmy (označované jako clockwork a projektor), spolu s výslovně uvedenými akcemi níže. Toto je obvyklý případ.<br />\nPokud je vypnuto, potom budou synchronizační algoritmy přeskočeny a budou vykonány pouze výslovně uvedené akce.
SynchronizationStep.title=Synchronizace
SynchronizationStep.tooltip.condition=Nastavení synchronizace bude uplatněno pouze tehdy, pokud je tato podmínka pravdivá. Podmínka se obvykle používá k třídění objektů stejného druhu podle záměrů. Například podmínka buže rozhodnout, zda uživatelské jméno začíná na "T". Pokud začíná, potom zatřídí uživatele do zámětu "test"; pokud ne, bude mít účet výchozí záměr.
SynchronizationStep.tooltip.confirmation=Potvrzující podmínka. Každý výsledek výrazu souvztažnosti bude předán potvrzujícímu výrazu. Pokud potvrzující výraz bude pravdivý, potom objekty budou propojeny. Pokud výraz souvztažnosti definován není, potom jsou všechny přijaty, vrácené z dotazu souvztažnosti, automaticky potvrzeny. Potvrzující výraz může i zatížit systém v rozumné míře, protože je vykonáván až nad objekty, které projdou dotazem na souvztažnost.
SynchronizationStep.tooltip.correlation=Korelační výraz. Korelační výraz je použit pro napojení vzorových objektů (například uživatele) a stínových účtů (například účtu uživatele), které patří dohromady. Výsledky korelačního výrazu ve filtru vyhledávání, které je spuštěno nad vzorovými objekty (obvykle uživateli). Dotaz vrátí potenciální objekty pro napojení. Je kladen velký důraz na účinnost korelačního výrazu, v opačném případě se toto projeví negativně na výkonu synchronizace.
SynchronizationStep.tooltip.enabled=Pokud je zvoleno, je toto synchronizační nastavení povoleno. Což je zároveň výchozí nastavení. Toto nastavení se dá použít k dočasnému vypnutí synchronizačního nastavení.
SynchronizationStep.tooltip.focus=Typ vzorového objektu který odpovídá objektu systému. Pro objekty účtů je toto obvykle objekt uživatele (UserType). Pro objekty oprávnění lze nastavit na typ role (RoleType) nebo typ organizační skupiny (OrgType), a podobně.
SynchronizationStep.tooltip.intent=Záměr objektu, pro který platí tato definice. Pokud již objekt (stínový účet) v momentě zpracování synchronizačním kódem druh a záměr má, bude tato definice druhu/záměru použita k vybrání nastavení synchronizace, které bude platné pro tento objekt. Pokud objekt nemá uveden druh/záměr, potom bude k výběru nastavení použita třída objektu a podmínky. V takovém případe bude objekt (stínový účet) označen záměrem uvedneém v této položce.
SynchronizationStep.tooltip.kind=Druh objektu, pro který platí tato definice. Pokud již objekt (stínový účet) v momentě zpracování synchronizačním kódem druh a záměr má, bude tato definice druhu/záměru použita k vybrání nastavení synchronizace, které bude platné pro tento objekt. Pokud objekt nemá uveden druh/záměr, potom bude k výběru nastavení použita třída objektu a podmínky. V takovém případe bude objekt (stínový účet) označen druhem uvedeném v této položce.
SynchronizationStep.tooltip.objectClass=Objektová třída, pro kterou tato definice platí. To bude použito pro vybrání synchronizačního nastavení v případě, že objekt (stínový účet) nemá ještě definován druh/záměr.
SynchronizationStep.tooltip.objectTemplate=Šablona objektu, která je použita pro zpracování této konkrétní synchronizační události. Pokud není zvolena žádná šablona objektu, potom bude použita obvyklá výchozí volba.
SynchronizationStep.tooltip.opportunistic=Pokud je povoleno, potom oportunistická synchronizace (takzvané prozkoumání) bude povolena během zpracování této události.
SynchronizationStep.tooltip.reaction=Určuje, jak systém zareaguje na tuto synchronizační událost. Může být uvedeno více reakcí. Bude vybrána reakce vhodná pro synchronizační situaci události.
SynchronizationStep.tooltip.reconcile=Pokud je zapnuto, potom bude pro tuto synchronizační událost rekonciliační krok vynucen. Atributy budou výslovně získány, pokud nejsou přítomny. <br />\nPokud je vypnuto, potom bude rekonciliace automatická. V takovém případě se rekonciliace uděje pouze tehdy, pokud budou v synchronizační události atributy přítomny. Pokud atributy přítomny nejsou, nebudou výslovně získávány a reonciliace bude přeskočena.
