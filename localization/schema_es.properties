ObjectType.resourceRef.help=Referencia al recurso al que pertenece una sombra de objeto de recurso.
ObjectType.pendingOperation.help=Describe las operaciones pendientes, por ejemplo, las operaciones asíncronas en curso o aquellas que requieren revisión o corrección.
ObjectType.name.help=Nombre o ID del objeto legible para las personas y modificable. Generalmente es único y obligatorio.
AssignmentType.name.help=Nombre o ID del objeto legible para las personas y modificable. Generalmente es único y obligatorio.
ObjectType.description.help=Descripción textual de formato libre del objeto.
ObjectType.documentation.help=Documentación técnica del objeto en formato AsciiDoc.
ObjectType.lifecycleState.help=Estado del ciclo de vida del objeto, por ejemplo, Borrador, Propuesto, Activo, Obsoleto, Archivado, etc.
FocusType.givenName.help=Nombre de pila del usuario, generalmente el primer nombre (por ejemplo, George).
FocusType.familyName.help=Apellido del usuario, generalmente el apellido (por ejemplo, Washington).
FocusType.additionalName.help=Segundo nombre (generalmente), patronímico, matronímico u otro nombre del usuario (por ejemplo, Anne o Ivanovna).
FocusType.nickName.help=Nombre familiar o informal del usuario (p. ej., Chris).
FocusType.honorificPrefix.help=Tratamientos honoríficos que preceden al nombre del usuario (por ejemplo, señor o capitán).
UserType.honorificSuffix.help=Tratamientos honoríficos que se colocan después del nombre del usuario (por ejemplo, PhD).
FocusType.title.help=Título que define el puesto de trabajo del usuario o su rol principal en la organización (p. ej., CEO, Oficial de Seguridad o Asistente).
FocusType.preferredLanguage.help=Idioma preferido del usuario en formato IETF, normalmente para la localización de interfaces de usuario (por ejemplo, en_US, cs o pt_BR).
FocusType.locale.help=Preferencia del usuario para mostrar monedas, fechas y otros elementos relacionados con la ubicación y la cultura, utilizando el formato IETF (por ejemplo, en_US, cs o pt_BR).
FocusType.timezone.help=Zona horaria preferida del usuario, especificada según la base de datos de zonas horarias en formato Olson (por ejemplo, Europe/Bratislava). Si no se especifica, se utilizará la zona horaria predeterminada del sistema.
FocusType.emailAddress.help=Dirección de correo electrónico utilizada para la comunicación (por ejemplo, para recibir notificaciones del sistema).
FocusType.telephoneNumber.help=Número de teléfono principal del usuario, unidad organizacional, etc.
FocusType.personalNumber.help=Identificador único e inmutable del usuario, orientado al negocio. Generalmente se utiliza como identificador de correlación.
FocusType.employeeNumber.help=Identificador único e inmutable del usuario, orientado al negocio. Generalmente se utiliza como identificador de correlación.
FocusType.costCenter.help=Nombre, identificador o código del centro de costos al que pertenece el usuario. Como normalmente se utiliza el centro de costos de la organización, este valor solo se tiene en cuenta para los usuarios que tienen un centro de costos diferente al de su organización o que no pertenecen a ninguna organización.
FocusType.organization.help=Identificador o nombre inmutable de la organización a la que pertenece el usuario. Se permiten varios valores.
FocusType.organizationalUnit.help=Identificador inmutable o nombre de la unidad organizativa a la que pertenece el usuario. Se permiten múltiples valores.
FocusType.locality.help=Localidad principal del usuario, es decir, el lugar donde el usuario suele trabajar (país, ciudad o edificio). Específico del despliegue.
ObjectType.indestructible.help=Protección contra la eliminación accidental. Si se establece en "Verdadero", este objeto no podrá eliminarse. Si deseas eliminarlo, primero debes modificarlo para restablecer esta marca.
ObjectType.effectiveMarkRef.help=Las marcas efectivas del objeto resultan de las políticas aplicadas y de las reglas de marcado automáticas. Estas marcas se calculan, no se establecen directamente.
AssignmentHolderType.jpegPhoto.help=Foto correspondente ao usuário / organização / função.
ObjectType.dead.help=Selecciona "Verdadero" para mostrar las proyecciones inactivas o "Falso" para mostrar solo las proyecciones activas.
ObjectType.objectClass.help=Referencia a una definición de tipo en el esquema del recurso (clase de objeto específica).
StorageMetadataType.createTimestamp.help=Marca de tiempo de creación de los datos. Se establece una sola vez y nunca debe modificarse. Si un objeto fue creado por un proceso en segundo plano (por ejemplo, una aprobación), indica cuándo finalizó el proceso.
ObjectType.exists.help=Establece en "Verdadero" para buscar objetos que sabes que existen en el recurso. Puede haber sombras correspondientes a objetos que aún no existen (por ejemplo, operaciones de creación en curso) o sombras de objetos sobre los que todavía no tienes información.
ShadowType.intent.help=El tipo de uso previsto o el propósito de los objetos. P. ej., para cuentas puede ser "user", "admin", "test".
ObjectType.kind.help=Tipo de uso de la sombra, por ejemplo, Cuenta, Derecho, etc.
StorageMetadataType.modifyTimestamp.help=Marca de tiempo de la última modificación de los datos. Debe actualizarse cuando se modifiquen los objetos. Las modificaciones que solo cambien atributos operativos pueden no actualizar esta marca de tiempo.
ObjectType.synchronizationSituation.help=La situación de sincronización más reciente, independientemente del canal.
ObjectType.subtype.help=Subtipo de objeto utilizado para distinguir lo que representa un objeto específico, es decir, si se trata de un tipo diferente de unidad organizativa, proyecto, equipo o usuario, etc.
ActivationType.administrativeStatus.help=Filtra por estado administrativo. Esto no define el estado real del objeto, ya que un administrador puede, por ejemplo, establecer un objeto como "Habilitado" aunque el atributo "Válido desde" aún no sea válido.
MappingsType.administrativeStatus.help=Estado establecido por el administrador. Esto no define el estado real del objeto, ya que un administrador puede, por ejemplo, establecer un objeto como "Habilitado" aunque el atributo "Válido desde" aún no sea válido.
MappingsType.effectiveStatus.help=Estado calculado a partir de configuraciones como el estado administrativo, las fechas de validez y otras propiedades de activación. No se establece directamente en los objetos.
ConstructionType.resourceRef.help=Referencia a un recurso que es el destino de la referencia. Puede ser implícita en algunos casos.
AssignmentType.targetRef.help=Destino de la asignación o inducción. Se trata del usuario, rol, organización o servicio que se asigna.
ActivationType.help=Define las propiedades de activación. Determina si un elemento está activo y en funcionamiento o inactivo (por ejemplo, deshabilitado). Por ejemplo, un usuario inactivo no debería poder iniciar sesión ni ejecutar tareas, y un rol inactivo no debería asignarse (si está asignado, no debería tenerse en cuenta al calcular las cuentas).
ActivationType.lockoutStatus.help=Estado de una cuenta deshabilitada temporalmente debido a intentos fallidos de inicio de sesión u otros intentos de uso indebido. Generalmente, lo establece el recurso o la autenticación de midPoint. El valor "Normal" desbloquea las cuentas.
ActivationType.validFrom.help=Fecha a partir de la cual se considera que un objeto está activo. Esto no se aplica si el indicador "enabled" está establecido explícitamente.
ActivationType.validTo.help=Fecha hasta la cual se considera que un objeto está activo. Esto no se aplica si el indicador "enabled" está establecido explícitamente.
ActivationType.lockoutExpirationTimestamp.help=Marca de tiempo del momento en que expira el bloqueo de la cuenta y esta vuelve a estar disponible para su uso. Solo se aplica si el estado de bloqueo no es "Normal".
ObjectType.archetypeRef.help=Hace referencia a los arquetipos activos aplicables, incluidos los arquetipos indirectos, como los supertipos de arquetipo. Los valores de referencia solo se recalculan cuando se recalculan los objetos.
ObjectType.parentOrgRef.help=Conjunto de organizaciones (unidades organizativas, proyectos, equipos) con las que el objeto está relacionado. Por lo general, esto significa que el objeto pertenece a ellas, pero también puede tener otros significados (por ejemplo, que un usuario administra una unidad organizativa).
CaseType.parentRef.help=Caso principal (si existe).
AssignmentHolderType.objectRef.help=Objeto al que está asociado el caso. En las aprobaciones, generalmente se trata del objeto cuya modificación, adición o eliminación está pendiente de aprobación. En los casos de aprovisionamiento manual, puede tratarse del recurso en el que se debe crear una cuenta. En los casos de correlación, se trata de la sombra completa (full shadow) que está siendo correlacionada.
CaseType.requestorRef.help=Usuario que solicitó la operación correspondiente.
CaseType.state.help=Estado del caso. Los estados predefinidos son: Creado (creado, pero aún no abierto), Abierto (los elementos de trabajo han sido creados y el trabajo está en curso), En cierre (la interacción humana ha finalizado, pero algunas acciones pueden estar pendientes, como esperar a que se complete una subtarea), En ejecución (ejecución automatizada o espera para que esta comience), Cerrado.
CaseType.targetRef.help=Caso al que está asociado el objetivo.
ActivationType.effectiveStatus.help=Estado calculado a partir de configuraciones como el estado administrativo, las fechas de validez y otras propiedades de activación. No se establece directamente en los objetos.
CredentialsType.otps=OTPs
EvenMoreAbstractMappingType.authoritative.help=Controla si la asignación elimina valores.\n\n"Verdadero" agrega y elimina valores: úsalo cuando existe una única fuente de verdad.\n\n"Falso" solo agrega valores y nunca los elimina: úsalo cuando existen varias fuentes.
EvenMoreAbstractMappingType.exclusive.help=Establece "Falso" (predeterminado) si la propiedad de destino seleccionada puede utilizarse en otras asignaciones.\nEstablece "Verdadero" si esta asignación es exclusiva de la propiedad de destino.
